apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes
type: Opaque
data:
  # Base64 Encode your secrets: echo -n "my-secret-value" | base64
  # Example: echo -n "secret123" | base64 -> c2VjcmV0MTIz
  
  # Database Passwords
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_PASSWORD" # e.g. hermes_password
  
  # JWT Config
  JWT_SECRET_KEY: "REPLACE_WITH_BASE64_JWT_SECRET" # openssl rand -hex 32
  
  # Azure AD Config (if applicable)
  AZURE_CLIENT_SECRET: "REPLACE_WITH_BASE64_AZURE_SECRET"
  
  # RabbitMQ (if used)
  RABBITMQ_PASSWORD: "REPLACE_WITH_BASE64_RABBITMQ_PASS"
