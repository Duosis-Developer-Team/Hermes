# =============================================================================
# HERMES - Giden ticket event dispatcher'i
# =============================================================================
# Her dakika kosar; kilitleme `FOR UPDATE SKIP LOCKED` + advisory lock
# ile saglanir, yani cakisan iki kosu AYNI olayi iki kez GONDEREMEZ.
# Ayni core-service image'i, ayni DB env'leri. Ana API surecinden
# bagimsizdir; buradaki bir hata API pod'unu etkilemez.
#
# Dalga D4: ayni tur talep e-postalarini da gonderir (ve yapilandirilmissa
# gelen kutuyu okur) — bu yuzden Graph/S2S/depolama env'leri de burada.
#
# NOT (deploy mekanigi): CD yalnizca set-image/restart yapar — bu
# manifest sunucuda MANUEL
#   kubectl apply -f k8s/ticket-dispatcher-cronjob.yaml
# ister. hermes-test'e AYRI karar olmadan uygulanmaz.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-ticket-dispatcher
  namespace: hermes-dev
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: ticket-dispatcher
              image: ghcr.io/duosis-developer-team/hermes-core-service:dev
              imagePullPolicy: Always
              command: ["python", "-m", "app.jobs.ticket_dispatcher"]
              env:
                - name: HERMES_ENVIRONMENT
                  value: "dev"
                - name: CORE_DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: DB_HOST_CORE
                - name: CORE_DB_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: DB_PORT
                # Runtime rolu (NOBYPASSRLS) — superuser DEGIL.
                - name: CORE_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: hermes-db-roles
                      key: CORE_APP_DB_USER
                - name: CORE_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: hermes-db-roles
                      key: CORE_APP_DB_PASSWORD
                - name: CORE_DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: POSTGRES_DB_CORE
                # shared/auth.py modul yuklemesi icin gerekli (job
                # hicbir HTTP istegi ALMAZ, yalnizca gonderir).
                - name: JWT_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hermes-jwt-auth
                      key: JWT_PUBLIC_KEY
                - name: SUPPORT_TICKETS_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: SUPPORT_TICKETS_ENABLED
                      optional: true
                - name: HERMES_SUPPORT_TENANT_ID
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: HERMES_SUPPORT_TENANT_ID
                      optional: true
                # Imzalama sirri OLMADAN gonderim YAPILMAZ; olay
                # kuyrukta retry'da bekler.
                - name: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT
                  valueFrom:
                    secretKeyRef:
                      name: hermes-ticket-webhooks
                      key: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT
                      optional: true
                - name: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT_NEXT
                  valueFrom:
                    secretKeyRef:
                      name: hermes-ticket-webhooks
                      key: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT_NEXT
                      optional: true
                # --- Talep e-postalari (Dalga D4) ----------------------------
                # Gonderim: bayrak + Graph (Mail.Send, gelen kutu icin
                # Mail.ReadWrite) + gonderen. Ajan adresleri ve gelen
                # e-postanin gondereni S2S dizinden cozulur; yetki (talep
                # acma izni) auth'tan. Eksik anahtar isi BOZMAZ: e-posta
                # gitmez, satir 24 saatte bayatlar.
                - name: NOTIFICATIONS_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: NOTIFICATIONS_ENABLED
                      optional: true
                - name: NOTIF_MAIL_SENDER
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: NOTIF_MAIL_SENDER
                      optional: true
                - name: APP_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: APP_BASE_URL
                      optional: true
                - name: AZURE_TENANT_ID
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: AZURE_TENANT_ID
                      optional: true
                - name: AZURE_CLIENT_ID
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: AZURE_CLIENT_ID
                      optional: true
                - name: AZURE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: hermes-secrets
                      key: AZURE_CLIENT_SECRET
                      optional: true
                - name: AUTH_SERVICE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: AUTH_SERVICE_URL
                      optional: true
                - name: HERMES_S2S_TOKEN_CURRENT
                  valueFrom:
                    secretKeyRef:
                      name: hermes-s2s
                      key: HERMES_S2S_TOKEN_CURRENT
                      optional: true
                - name: HERMES_S2S_TOKEN_NEXT
                  valueFrom:
                    secretKeyRef:
                      name: hermes-s2s
                      key: HERMES_S2S_TOKEN_NEXT
                      optional: true
                # Gelen kutu: anahtar yoksa KAPALI (bos = calismaz).
                - name: TICKET_MAIL_INBOUND_MAILBOX
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_MAIL_INBOUND_MAILBOX
                      optional: true
                # Gelen e-posta ekleri ayni tarama hattindan gecer.
                - name: TICKET_ATTACHMENTS_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_ATTACHMENTS_ENABLED
                      optional: true
                - name: TICKET_STORAGE_BACKEND
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_STORAGE_BACKEND
                      optional: true
                - name: TICKET_S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_S3_BUCKET
                      optional: true
                - name: TICKET_S3_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_S3_REGION
                      optional: true
                - name: TICKET_S3_ENDPOINT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_S3_ENDPOINT_URL
                      optional: true
                - name: TICKET_SCANNER_MODE
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_SCANNER_MODE
                      optional: true
                - name: TICKET_SCANNER_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: hermes-config
                      key: TICKET_SCANNER_HOST
                      optional: true
                - name: TICKET_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: hermes-ticket-storage
                      key: TICKET_S3_ACCESS_KEY_ID
                      optional: true
                - name: TICKET_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hermes-ticket-storage
                      key: TICKET_S3_SECRET_ACCESS_KEY
                      optional: true
