apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes-dev
data:
  # Database Connection Info
  DB_HOST_AUTH: "auth-db"
  DB_HOST_CORE: "core-db"
  DB_PORT: "5432"
  POSTGRES_USER: "hermes"
  POSTGRES_DB_AUTH: "auth_db"
  POSTGRES_DB_CORE: "core_db"

  # Service URLs (Internal K8s DNS)
  AUTH_SERVICE_URL: "http://auth-service/api/v1"
  CORE_SERVICE_URL: "http://core-service/api/v1"
  REPORTING_SERVICE_URL: "http://reporting-service/api/v1"
  
  # ---------------------------------------------------------------------
  # Tenant SaaS (WS3/WS10)
  # ---------------------------------------------------------------------
  # Mevcut Hermes verisinin tasindigi ILK tenant. Bu degerler migration
  # 0003 tarafindan BIR KEZ kullanilir; sonradan degistirmek mevcut
  # veriyi TASIMAZ, yalnizca yeni bir tenant yaratir.
  INITIAL_TENANT_SLUG: "duosis"
  INITIAL_TENANT_NAME: "Duosis"
  INITIAL_TENANT_TIMEZONE: "Europe/Istanbul"
  # Legacy host: eski URL'ler ve e-posta linkleri bu tenant'a cozulur.
  #
  # BU DOSYA hermes-dev ICINDIR — deger, dev'e GERCEKTEN gelinen adres
  # olmalidir. Tenant cozumu Host basligina bakar ve eslesme yoksa
  # fail-closed 404 `workspace_not_found` doner; yani yanlis bir hostname
  # LOGIN'I TAMAMEN KAPATIR. Bir kez tam olarak boyle oldu: buraya test
  # ortaminin adresi (`hermes.duosis.com`) yazilmisti ve dev'de ne parola
  # ne de Microsoft girisi calisti.
  #
  # dev  = 84.247.180.172 (ingress'te host kurali YOK, IP ile gelinir)
  # test = hermes.duosis.com  <-- BURAYA YAZILMAZ
  INITIAL_TENANT_HOSTNAME: "84.247.180.172"
  # `?workspace={slug}` ile tenant secimi.
  #
  # hermes-dev'de ACIK (WS12): dev tek IP uzerinden servis ediliyor ve
  # ingress'te host kurali yok, dolayisiyla host tabanli adresleme TEK
  # bir tenant'a yer birakir. Konsoldan acilan ikinci bir tenant'a
  # ulasmanin baska yolu olmazdi.
  #
  # PRODUCTION'da ASLA "true" olmamali: host disinda bir tenant secme
  # yolu birakir. Orada her tenant kendi hostname'iyle adreslenir.
  HERMES_ALLOW_WORKSPACE_PATH: "true"

  # App Settings
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  
  # Azure AD Config
  AZURE_CLIENT_ID: "77dc01d8-6383-46ce-bc63-6da9ab8f3614"
  AZURE_TENANT_ID: "6d7f5e10-f771-470c-b372-5ddab61689cf"

  # Task assignment e-mail notifications (sent via Microsoft Graph using the
  # Azure app above — needs Mail.Send application permission + admin consent).
  # Enabled on dev for testing; flip to "false" to silence without a rebuild.
  NOTIFICATIONS_ENABLED: "true"
  NOTIF_MAIL_SENDER: "hermes@duosis.com"
  NOTIF_NOTIFY_ASSIGNER: "true"
  # Public app URL for the "View task" button; leave empty to omit the link.
  APP_BASE_URL: ""

  # ---------------------------------------------------------------------
  # Ortak urun ticket platformu (Ticket Hub)
  # ---------------------------------------------------------------------
  # HERMES_SUPPORT_TENANT_ID = Duosis tenant'inin UUID'si. BOS BIRAKILIRSA
  # modul KAPALIDIR (fail-closed) ve hicbir canonical ticket yazilmaz.
  # Deger koda GOMULMEZ; ortam sahibi doldurur:
  #
  #   kubectl -n hermes-dev exec deploy/auth-service -- \
  #     python -c "import os;print(os.environ.get('INITIAL_TENANT_SLUG'))"
  #   # veya auth_db: SELECT id FROM tenants WHERE slug='duosis';
  #
  # YANLIS bir UUID yazmak BASKA bir tenant'ta ticket acmak demektir;
  # startup dogrulamasi tenant'i `tenant_registry`de arar ve
  # bulamazsa/pasifse modulu ACMAZ.
  SUPPORT_TICKETS_ENABLED: "true"
  HERMES_SUPPORT_TENANT_ID: ""
  SUPPORT_AUTO_CLOSE_DAYS: "7"

  # Attachment ozelligi. Object storage ve malware tarayici HAZIR
  # OLMADAN "true" YAPILMAZ: acikken /ready yapilandirmayi dogrular ve
  # eksikse pod trafige alinmaz. Ticket METIN akisi bu bayraktan
  # bagimsiz calisir.
  TICKET_ATTACHMENTS_ENABLED: "false"
  # local | s3   (uretimde s3 zorunlu)
  TICKET_STORAGE_BACKEND: "local"
  TICKET_S3_ENDPOINT_URL: ""
  TICKET_S3_REGION: "us-east-1"
  TICKET_S3_BUCKET: ""
  # clamav | disabled_dev_only  ('disabled_dev_only' YALNIZCA dev'de
  # kabul edilir; 'live' ortamda attachment ozelligini ACMAZ)
  TICKET_SCANNER_MODE: "disabled_dev_only"
  TICKET_SCANNER_HOST: ""
