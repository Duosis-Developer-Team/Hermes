apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: hermes-dev
  labels:
    app: core-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
      # Prometheus hedef kesfi POD annotation'larindan yapilir — Service
      # uzerine konursa metrik toplanir ama HICBIR ekranda gorunmez
      # (bkz. HERMES_METRICS.md). Port 9090 = uygulama portundan AYRI,
      # yalnizca kume ici; ingress bu porta hicbir yol tasimaz.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: core-service
        # DIKKAT — BU ETIKET YALNIZCA ILK KURULUM ICINDIR.
        # Calisan Deployment her zaman IMMUTABLE SHA'ya pinlenir; bunu
        # CD yapar (`kubectl set image`, bkz. .github/workflows/cd-*.yml).
        # Bu dosyayi OLDUGU GIBI `kubectl apply` etmek, calisan surumu
        # buradaki mutable etikete GERI DONDURUR — 2026-08-06'da canli
        # diff'te yakalandi.
        #
        # Bu yuzden: yalniz bir alani degistirmek gerekiyorsa APPLY DEGIL
        # PATCH kullanin, orn.
        #   kubectl -n <ns> patch deployment core-service --type=json \
        #     -p='[{"op":"replace",
        #           "path":"/spec/template/spec/containers/0/resources/limits/cpu",
        #           "value":"1500m"}]'
        # Tam apply gerekiyorsa ardindan CD'yi yeniden calistirin ya da
        # `set image` ile SHA'yi tekrar pinleyin.
        image: ghcr.io/duosis-developer-team/hermes-core-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        - containerPort: 9090
          name: metrics
        env:
        # Metrik etiketi 'environment' = KATALOG ANAHTARI ('dev'),
        # namespace ('hermes-dev') DEGIL. ConfigMap'teki ENVIRONMENT
        # anahtari bu is icin KULLANILMAZ: orada deger "production".
        - name: HERMES_ENVIRONMENT
          value: "dev"
        # Database
        - name: CORE_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_CORE
        - name: CORE_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        # WS1 — RUNTIME ROLU (superuser DEGIL).
        # Uygulama artik `hermes` superuser'i ile baglanmaz: o rol
        # RLS'i asar ve tenant izolasyonunu anlamsiz kilardi. Bu kimlik
        # NOBYPASSRLS'tir ve hicbir tablonun sahibi degildir.
        # Kurulum: backend/sql_scripts/roles/README.md
        - name: CORE_DB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: CORE_APP_DB_USER
        - name: CORE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: CORE_APP_DB_PASSWORD
        - name: CORE_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_CORE
        
        # Services & Security
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        # Stage 5B-2: S2S directory credential (dizin + e-posta alici
        # cozumu). Secret anahtari uygulanana kadar optional — pod
        # rollout'u bloklamaz; bos deger = dizin kapali (fail closed).
        - name: HERMES_S2S_TOKEN_CURRENT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_CURRENT
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'

        # Microsoft Graph (Meetings module). All three must be set for
        # /admin/meetings/sync to work; if any is missing the service
        # still starts and the endpoint returns a clean "not configured"
        # error instead of crashing. Values are already provisioned in
        # the auth-service deployment, we just project them here too.
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
              optional: true

        # Task assignment e-mail notifications (Microsoft Graph)
        - name: NOTIFICATIONS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: NOTIFICATIONS_ENABLED
              optional: true
        - name: NOTIF_MAIL_SENDER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: NOTIF_MAIL_SENDER
              optional: true
        - name: NOTIF_NOTIFY_ASSIGNER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: NOTIF_NOTIFY_ASSIGNER
              optional: true
        - name: APP_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: APP_BASE_URL
              optional: true

        # ------------------------------------------------------------------
        # Ortak urun ticket platformu (Ticket Hub)
        # ------------------------------------------------------------------
        # HEPSI `optional: true`: anahtar henuz ConfigMap'te yoksa pod
        # ACILIR ve modul KAPALI kalir (fail-closed). Boylece bu manifest
        # ile secret/config uygulanmasi arasindaki sirayi kacirmak
        # rollout'u bloklamaz.
        #
        # HERMES_SUPPORT_TENANT_ID bos/gecersiz ise modul kapalidir:
        # canonical ticket YAZILAMAZ. Yanlis bir UUID ile BASKA bir
        # tenant'a yazma ihtimali, startup dogrulamasiyla kapatilir.
        - name: SUPPORT_TICKETS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: SUPPORT_TICKETS_ENABLED
              optional: true
        - name: HERMES_SUPPORT_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: HERMES_SUPPORT_TENANT_ID
              optional: true
        - name: SUPPORT_AUTO_CLOSE_DAYS
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: SUPPORT_AUTO_CLOSE_DAYS
              optional: true
        # Attachment ozelligi: object storage + malware tarayici HAZIR
        # OLMADAN acilmaz. Acikken /ready, yapilandirmayi dogrular ve
        # eksikse pod trafige ALINMAZ (fail-open yok).
        - name: TICKET_ATTACHMENTS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_ATTACHMENTS_ENABLED
              optional: true
        - name: TICKET_STORAGE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_STORAGE_BACKEND
              optional: true
        - name: TICKET_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_S3_ENDPOINT_URL
              optional: true
        - name: TICKET_S3_REGION
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_S3_REGION
              optional: true
        - name: TICKET_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_S3_BUCKET
              optional: true
        - name: TICKET_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: hermes-ticket-storage
              key: TICKET_S3_ACCESS_KEY_ID
              optional: true
        - name: TICKET_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-ticket-storage
              key: TICKET_S3_SECRET_ACCESS_KEY
              optional: true
        - name: TICKET_SCANNER_MODE
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_SCANNER_MODE
              optional: true
        - name: TICKET_SCANNER_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_SCANNER_HOST
              optional: true
        # Giden webhook imzalama sirri: uygulama KODU basina bir anahtar.
        # Secret'ta yoksa o uygulamanin olaylari GONDERILMEZ (imzasiz
        # gonderme yolu YOKTUR) ve kuyrukta retry'da bekler.
        - name: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT
          valueFrom:
            secretKeyRef:
              name: hermes-ticket-webhooks
              key: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT
              optional: true
        - name: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT_NEXT
          valueFrom:
            secretKeyRef:
              name: hermes-ticket-webhooks
              key: HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT_NEXT
              optional: true

        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          # OLCULEREK ARTIRILDI (2026-08-25). Once 1sn'di, 5sn'ye
          # cikarilmisti; 5sn de yetmedi. hermes-test'te core-service
          # gercek kullanici yuku altinda ~1sa45dk sonra tikandi, liveness
          # 5 kez dustu ve kubelet pod'u OLDURDU (exitCode 137 — OOM
          # DEGIL). Oldurmek durumu KOTULESTIRIYOR: soguk baslangic yuku
          # artiriyor ve dongu kendini besliyor.
          #
          # Sebep bellek DEGILDI: 4 saatlik cgroup ornekleme (865 olcum)
          # en yuksek 219MB/512MB gosterdi ve CPU throttle 77.000
          # periyotta 6'ydi. Probe'un kendisi fazla agresifti.
          #
          # 10sn + 10 esik = gercekten olu bir surec hala yeniden
          # baslatilir (~200sn), ama anlik bir yavaslama saglikli bir
          # pod'u OLDURMEZ.
          timeoutSeconds: 10
          failureThreshold: 10
        # WS10: readiness sema uyumlulugunu DA kontrol eder.
        # Liveness BILEREK /health'te kalir — yanlis sema pod'u
        # yeniden baslatmaz (bu crashloop olurdu), yalnizca
        # trafikten alir.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1500m"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: hermes-dev
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: core-service
