apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: hermes-dev
  labels:
    app: core-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: core-service
        image: ghcr.io/duosis-developer-team/hermes-core-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        # Database
        - name: CORE_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_CORE
        - name: CORE_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        - name: CORE_DB_USER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_USER
        - name: CORE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: POSTGRES_PASSWORD
        - name: CORE_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_CORE
        
        # Services & Security
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'

        # Microsoft Graph (Meetings module). All three must be set for
        # /admin/meetings/sync to work; if any is missing the service
        # still starts and the endpoint returns a clean "not configured"
        # error instead of crashing. Values are already provisioned in
        # the auth-service deployment, we just project them here too.
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
              optional: true

        # Task assignment e-mail notifications (Microsoft Graph)
        - name: NOTIFICATIONS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: NOTIFICATIONS_ENABLED
              optional: true
        - name: NOTIF_MAIL_SENDER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: NOTIF_MAIL_SENDER
              optional: true
        - name: NOTIF_NOTIFY_ASSIGNER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: NOTIF_NOTIFY_ASSIGNER
              optional: true
        - name: APP_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: APP_BASE_URL
              optional: true

        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: hermes-dev
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: core-service
