apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
data:
  # ---------------------------------------------------------------------
  # Tenant SaaS (WS3/WS10/WS12) — hermes-test
  # ---------------------------------------------------------------------
  # Mevcut Hermes verisinin tasindigi ILK tenant. Bu degerler migration
  # 0003 tarafindan BIR KEZ kullanilir; sonradan degistirmek mevcut
  # veriyi TASIMAZ, yalnizca yeni bir tenant yaratir.
  INITIAL_TENANT_SLUG: "duosis"
  INITIAL_TENANT_NAME: "Duosis"
  INITIAL_TENANT_TIMEZONE: "Europe/Istanbul"
  # BU DOSYA hermes-test ICINDIR — deger, test'e GERCEKTEN gelinen adres
  # olmalidir. Tenant cozumu Host basligina bakar; yanlis hostname
  # LOGIN'I TAMAMEN KAPATIR (dev'de birebir yasandi).
  #
  # test = hermes.duosis.com
  # dev  = 84.247.180.172   <-- BURAYA YAZILMAZ
  INITIAL_TENANT_HOSTNAME: "hermes.duosis.com"
  # `?workspace={slug}` ile tenant secimi. hermes-test PRODUCTION-LIKE'dir:
  # KAPALI kalir; host disinda bir tenant secme yolu birakmaz. Yeni bir
  # tenant burada kendi hostname'iyle adreslenir.
  HERMES_ALLOW_WORKSPACE_PATH: "false"

  # Database Connection Info
  DB_HOST_AUTH: "auth-db"
  DB_HOST_CORE: "core-db"
  DB_PORT: "5432"
  POSTGRES_USER: "hermes"
  POSTGRES_DB_AUTH: "auth_db"
  POSTGRES_DB_CORE: "core_db"

  # Service URLs (Internal K8s DNS — hermes-test namespace)
  AUTH_SERVICE_URL: "http://auth-service/api/v1"
  CORE_SERVICE_URL: "http://core-service/api/v1"
  REPORTING_SERVICE_URL: "http://reporting-service/api/v1"

  # App Settings
  ENVIRONMENT: "test"
  LOG_LEVEL: "INFO"

  # Azure AD Config
  AZURE_CLIENT_ID: "77dc01d8-6383-46ce-bc63-6da9ab8f3614"
  AZURE_TENANT_ID: "6d7f5e10-f771-470c-b372-5ddab61689cf"

  # Task assignment e-mail notifications (sent via Microsoft Graph using the
  # Azure app above — Mail.Send application permission + admin consent done).
  NOTIFICATIONS_ENABLED: "true"
  NOTIF_MAIL_SENDER: "hermes@duosis.com"
  NOTIF_NOTIFY_ASSIGNER: "true"
  # Public app URL for the "View task" button in notification e-mails.
  APP_BASE_URL: "https://hermes.duosis.com"

  # ---------------------------------------------------------------------
  # Ortak urun ticket platformu (Ticket Hub) — hermes-test
  # ---------------------------------------------------------------------
  # DIKKAT: bu UUID hermes-test'in KENDI Duosis tenant'idir ve dev'inkinden
  # FARKLIDIR (ayri veritabani). Yanlis UUID yazmak baska bir tenant'ta
  # ticket acmak demektir; startup dogrulamasi tenant'i `tenant_registry`de
  # arar ve bulamazsa/pasifse modulu ACMAZ (fail-closed).
  SUPPORT_TICKETS_ENABLED: "true"
  HERMES_SUPPORT_TENANT_ID: "4dc7666d-d261-4937-870f-0a877c6983d9"
  SUPPORT_AUTO_CLOSE_DAYS: "7"

  # Attachment: object storage + malware tarayici HAZIR OLANA KADAR
  # KAPALI. Acikken /ready yapilandirmayi dogrular ve eksikse pod trafige
  # ALINMAZ. Ticket METIN akisi bundan bagimsiz calisir.
  TICKET_ATTACHMENTS_ENABLED: "false"
  TICKET_STORAGE_BACKEND: "s3"
  TICKET_S3_ENDPOINT_URL: ""
  TICKET_S3_REGION: "us-east-1"
  TICKET_S3_BUCKET: ""
  # Uretim durusu: tarayicisiz mod burada KABUL EDILMEZ ('live' ortamda
  # attachment ozelligini acmaz).
  TICKET_SCANNER_MODE: "clamav"
  TICKET_SCANNER_HOST: ""

  # Giden webhook: HTTPS ZORUNLU ve private/loopback hedefler yasak.
  # test/prod'da bu bayrak "false" KALIR — dev'deki kume ici duz HTTP
  # istisnasi buraya TASINMAZ.
  TICKET_WEBHOOK_ALLOW_INSECURE_HTTP: "false"

