# =============================================================================
# HERMES - MCP ingress route (Stage 5D, AYRI Ingress kaynagi)
# =============================================================================
# Paylasilan hermes-ingress'e DOKUNMAZ (canli drift foot-gun'i): /mcp ve
# /.well-known/oauth-protected-resource yollari icin bagimsiz kaynak.
# Ayni host + TLS secret'i. Streamable HTTP icin proxy buffering KAPALI
# ve uzun read timeout (SSE/stream uyumu). CORS bilerek ACILMADI —
# MCP client'lari tarayici degildir; gerekirse ayri karar.
# =============================================================================
# INGRESS SAHIPLIK MODELI (Stage 5, CTO karari):
#   BU kaynak YALNIZCA /mcp + /.well-known/oauth-protected-resource
#   sahibidir. Uygulama route'lari (/, /api/*) 05-ingress'e aittir ve
#   buraya ASLA eklenmez (cift sahiplik = belirsiz birlesme).
#   Kilit: mcp-service/tests/test_stage5d_ingress_ownership.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-mcp-ingress
  namespace: hermes-test
  annotations:
    kubernetes.io/ingress.class: nginx-test
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  tls:
  - hosts:
    - hermes.duosis.com
    secretName: hermes-tls
  ingressClassName: nginx-test
  rules:
  - host: hermes.duosis.com
    http:
      paths:
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: hermes-mcp
            port:
              number: 80
      - path: /.well-known/oauth-protected-resource
        pathType: Prefix
        backend:
          service:
            name: hermes-mcp
            port:
              number: 80
