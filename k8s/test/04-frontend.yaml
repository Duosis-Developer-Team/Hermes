apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hermes-test
  labels:
    app: frontend
    environment: test
    project: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        environment: test
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/duosis-developer-team/hermes-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
# NodePort Service — test ortamı için farklı port üzerinden erişim
# HTTP:  http://84.247.180.172:30880
# HTTPS: https://84.247.180.172:30443 (Ingress üzerinden yönetildiğinde)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: frontend
