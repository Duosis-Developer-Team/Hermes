apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: hermes-test
  labels:
    app: reporting-service
    environment: test
    project: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        environment: test
      # Prometheus hedef kesfi POD annotation'larindan yapilir (Service
      # uzerinde ETKISIZ olur — bkz. HERMES_METRICS.md).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: reporting-service
        image: ghcr.io/duosis-developer-team/hermes-reporting-service:test
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        - containerPort: 9090
          name: metrics
        env:
        # Metrik etiketi 'environment' = KATALOG ANAHTARI ('test'),
        # namespace ('hermes-test') DEGIL.
        - name: HERMES_ENVIRONMENT
          value: "test"
        # OpenTelemetry izleri -> Drake (shared/tracing.py). Hedef bos/yoksa
        # izler KAPALI. Yayilim B3 (kodda varsayilan; Datadog ddtrace'in W3C
        # basligiyla cakismasin diye) — OTEL_PROPAGATORS burada VERILMEZ.
        # k8s.* ozellikleri Downward API'den; Drake gateway'i izlere eklemez.
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://drake-otel-gateway.drake-otel.svc:4317"
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME),k8s.deployment.name=reporting-service"
        # Service URLs
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: CORE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: CORE_SERVICE_URL

        # Security
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY

        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 20
          # timeoutSeconds ACIKCA verilir: varsayilan 1 sn'dir ve bu
          # kumede fazla agresif (core-service'te saglikli pod'lar bu
          # yuzden oldurulup servis kapandi, 2026-08-25).
          timeoutSeconds: 10
          # 2026-08-28: node stall'i sirasinda 10 esik de yetmedi
          # (bkz. 03-backend-core.yaml — olculen PSI: io full %14.7).
          # Saglikli bir pod'u node yavasligi yuzunden yeniden baslatmak
          # kesintiyi BUYUTUYOR; 18 esik ~6 dk tolerans verir.
          failureThreshold: 18
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          # failureThreshold ACIKCA verilir: varsayilan 3 (=30 sn) node
          # stall'inda saglikli pod'u trafikten aliyordu (2026-08-28).
          failureThreshold: 6

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: reporting-service
