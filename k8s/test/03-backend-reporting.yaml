apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: hermes-test
  labels:
    app: reporting-service
    environment: test
    project: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        environment: test
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: reporting-service
        image: ghcr.io/duosis-developer-team/hermes-reporting-service:test
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        env:
        # Service URLs
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: CORE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: CORE_SERVICE_URL

        # Security
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY

        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: reporting-service
