apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
type: Opaque
data:
  # Base64 Encode your secrets: echo -n "my-secret-value" | base64
  # These values must match the dev namespace secrets exactly.

  # Database Passwords
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_PASSWORD" # same as hermes namespace

  # JWT Config
  JWT_SECRET_KEY: "REPLACE_WITH_BASE64_JWT_SECRET" # same as hermes namespace

  # Azure AD Config
  AZURE_CLIENT_SECRET: "REPLACE_WITH_BASE64_AZURE_SECRET" # same as hermes namespace

  # RabbitMQ (if used)
  RABBITMQ_PASSWORD: "REPLACE_WITH_BASE64_RABBITMQ_PASS" # same as hermes namespace
