apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hermes-test
  labels:
    app: auth-service
    environment: test
    project: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        environment: test
      # Prometheus hedef kesfi POD annotation'larindan yapilir (Service
      # uzerinde ETKISIZ olur — bkz. HERMES_METRICS.md).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: auth-service
        image: ghcr.io/duosis-developer-team/hermes-auth-service:test
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        - containerPort: 9090
          name: metrics
        env:
        # Metrik etiketi 'environment' = KATALOG ANAHTARI ('test'),
        # namespace ('hermes-test') DEGIL.
        - name: HERMES_ENVIRONMENT
          value: "test"
        # Stage 5 promotion: internal directory S2S (test'e OZEL secret).
        - name: HERMES_S2S_TOKEN_CURRENT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_CURRENT
              optional: true
        - name: HERMES_S2S_TOKEN_NEXT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_NEXT
              optional: true
        # Database Connection
        # Tenant cozumu: hermes-test PRODUCTION-LIKE'dir, ConfigMap'te
        # "false" tasir ve slug ile tenant secimi KAPALIDIR. Yine de
        # acikca baglanir ki ayar gercek ve denetlenebilir olsun.
        - name: HERMES_ALLOW_WORKSPACE_PATH
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: HERMES_ALLOW_WORKSPACE_PATH
              optional: true
        - name: AUTH_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_AUTH
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        # RUNTIME ROL (WS1): uygulama artik veritabani superuser'i ile
        # DEGIL, NOBYPASSRLS ve hicbir tablonun sahibi OLMAYAN
        # `hermes_auth_app` rolu ile baglanir. Bu adim yapilmadan RLS
        # uygulama icin FIILEN DEVREDE DEGILDIR (superuser onu asar).
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: AUTH_APP_DB_USER
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: AUTH_APP_DB_PASSWORD
        - name: AUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_AUTH

        # Security
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        # RS256 asimetrik JWT (Stage 5 promotion — canli rollout bulgusu):
        # bu ref'ler manifestte YOKTU ve apply, calisan pod'daki env'leri
        # silip auth-service'i kirabiliyordu. Kalici olarak eklendi;
        # dev manifestiyle (k8s/03-backend-auth.yaml) birebir ayni.
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PRIVATE_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          httpGet:
            # /ready sema uyumlulugunu da dogrular: yanlis sema uzerinde
            # calisan bir pod TRAFIK ALMAZ (fail-closed).
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: auth-service
