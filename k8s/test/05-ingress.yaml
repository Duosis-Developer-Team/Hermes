# INGRESS SAHIPLIK MODELI (Stage 5, CTO karari):
#   BU kaynak → uygulama route'lari: / · /api/v1/auth · /api/v1/users ·
#   /api/v1/reports · /api/v1 · /api/public
#   MCP route'lari (/mcp, /.well-known/oauth-protected-resource) BU
#   DOSYADA YER ALMAZ — onlar 09-mcp-ingress'e aittir. ingress-nginx
#   ayni host'un iki Ingress'ini tek server blogunda birlestirir; sart:
#   ayni (host,path) iki kaynakta olmayacak + ayni ingressClass + ayni
#   TLS secret. Kilit: mcp-service/tests/test_stage5d_ingress_ownership.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-test-ingress
  namespace: hermes-test
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx-test  # <-- ayrı controller, dev'e dokunmaz
  tls:
  - hosts:
    - "84.247.180.172"
    - "hermes.duosis.com"
    secretName: hermes-tls
  rules:
  # Test ortamı: https://84.247.180.172:30443
  - host: 84.247.180.172
    http:
      paths:
      # Auth Service Routes
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80

      # Reporting Service Routes
      - path: /api/v1/reports
        pathType: Prefix
        backend:
          service:
            name: reporting-service
            port:
              number: 80

      # Core Service Routes (Catch-all for API)
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80

      # Public API (external integrations) — core-service'teki izole
      # /api/public alt-uygulamasina gider. Bu kural olmadan /api/public
      # SPA catch-all'ina duser ve index.html doner.
      - path: /api/public
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80

      # Frontend (Root)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

  # Test ortami DOMAIN erisimi: https://hermes.duosis.com
  # (IP host'u NodePort erisimi icin korunur — ikisi ayni servisleri
  # gosterir. Canli rollout bulgusu: /api/public YALNIZCA host-ozel
  # kural altinda calisir; aksi halde SPA catch-all'a duser.)
  - host: hermes.duosis.com
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /api/v1/reports
        pathType: Prefix
        backend:
          service:
            name: reporting-service
            port:
              number: 80
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80
      - path: /api/public
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
