# =============================================================================
# Test Ortamı için İkinci Nginx Ingress Controller
# NodePort: 30880 (HTTP), 30443 (HTTPS)
# IngressClass: nginx-test
# Sadece hermes-test namespace'ini izler — dev'e dokunmaz.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx-test
  labels:
    app.kubernetes.io/name: ingress-nginx-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx-test
  namespace: ingress-nginx-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-test-controller
  namespace: ingress-nginx-test
data: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-nginx-test
rules:
  - apiGroups: [""]
    resources: [configmaps, endpoints, nodes, pods, secrets, namespaces]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [list, watch, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-nginx-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-nginx-test
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-test
    namespace: ingress-nginx-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-nginx-test
  namespace: ingress-nginx-test
rules:
  - apiGroups: [""]
    resources: [configmaps, pods, secrets, endpoints, services, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [events, configmaps]
    verbs: [create, patch, get, update]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [list, watch, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-nginx-test
  namespace: ingress-nginx-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingress-nginx-test
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-test
    namespace: ingress-nginx-test
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx-test
spec:
  controller: k8s.io/ingress-nginx-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-test-controller
  namespace: ingress-nginx-test
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: ingress-nginx-test
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: ingress-nginx-test
    spec:
      serviceAccountName: ingress-nginx-test
      terminationGracePeriodSeconds: 300
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: controller
        image: registry.k8s.io/ingress-nginx/controller:v1.9.6
        imagePullPolicy: IfNotPresent
        args:
          - /nginx-ingress-controller
          - --election-id=ingress-nginx-test-leader
          - --controller-class=k8s.io/ingress-nginx-test
          - --ingress-class=nginx-test
          - --configmap=ingress-nginx-test/ingress-nginx-test-controller
          - --watch-namespace=hermes-test
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_BIND_SERVICE
            drop:
              - ALL
          runAsUser: 101
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: metrics
          containerPort: 10254
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10254
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10254
          initialDelaySeconds: 10
          periodSeconds: 10
---
# Test ingress controller için NodePort Service
# HTTP:  http://84.247.180.172:30880
# HTTPS: https://84.247.180.172:30443
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-test-controller
  namespace: ingress-nginx-test
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx-test
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30880
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    nodePort: 30443
    protocol: TCP
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx-test
