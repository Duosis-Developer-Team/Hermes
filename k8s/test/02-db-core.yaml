apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core-db
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  serviceName: "core-db"
  replicas: 1
  selector:
    matchLabels:
      app: core-db
  template:
    metadata:
      labels:
        app: core-db
        environment: test
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:2.21.4-pg15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_CORE
        volumeMounts:
        - name: core-db-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - hermes
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - hermes
          initialDelaySeconds: 10
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: core-db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: core-db
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: core-db
  clusterIP: None # Headless service for StatefulSet
