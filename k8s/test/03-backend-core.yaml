apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: hermes-test
  labels:
    app: core-service
    environment: test
    project: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
        environment: test
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: core-service
        image: ghcr.io/duosis-developer-team/hermes-core-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        # Database
        - name: CORE_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_CORE
        - name: CORE_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        - name: CORE_DB_USER
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_USER
        - name: CORE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: POSTGRES_PASSWORD
        - name: CORE_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_CORE

        # Services & Security
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'

        # Microsoft Graph app credentials (optional — used by Meetings sync
        # and task e-mail notifications). optional:true so a missing secret
        # never blocks the pod; Graph just reports "not configured".
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
              optional: true

        # Task assignment e-mail notifications (Microsoft Graph). Set as
        # literals to mirror the live deployment (applied via `kubectl set
        # env`), so re-applying this manifest keeps mail on and matches the
        # cluster exactly. Flip NOTIFICATIONS_ENABLED to "false" to silence.
        - name: NOTIFICATIONS_ENABLED
          value: "true"
        - name: NOTIF_MAIL_SENDER
          value: hermes@duosis.com
        - name: NOTIF_NOTIFY_ASSIGNER
          value: "true"
        - name: APP_BASE_URL
          value: ""

        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: core-service
