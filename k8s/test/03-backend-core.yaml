apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: hermes-test
  labels:
    app: core-service
    environment: test
    project: hermes
spec:
  # IKI REPLIKA (2026-08-25): hermes-test production-like'dir ve gercek
  # kullanicilari var. Tek replikada, pod yeniden baslarken (bu kumede
  # Datadog 7 init konteyner enjekte ediyor, aciliş 5-7 dk) servis TAMAMEN
  # kapaniyordu. Ikinci replika, bir pod yenilenirken digerinin hizmet
  # vermesini saglar.
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
        environment: test
      # Prometheus hedef kesfi POD annotation'larindan yapilir — Service
      # uzerine konursa metrik toplanir ama HICBIR ekranda gorunmez
      # (bkz. HERMES_METRICS.md). Port 9090 = uygulama portundan AYRI,
      # yalnizca kume ici; ingress bu porta hicbir yol tasimaz.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: core-service
        # DIKKAT — BU ETIKET YALNIZCA ILK KURULUM ICINDIR.
        # Calisan Deployment her zaman IMMUTABLE SHA'ya pinlenir; bunu
        # CD yapar (`kubectl set image`, bkz. .github/workflows/cd-*.yml).
        # Bu dosyayi OLDUGU GIBI `kubectl apply` etmek, calisan surumu
        # buradaki mutable etikete GERI DONDURUR — 2026-08-06'da canli
        # diff'te yakalandi.
        #
        # Bu yuzden: yalniz bir alani degistirmek gerekiyorsa APPLY DEGIL
        # PATCH kullanin, orn.
        #   kubectl -n <ns> patch deployment core-service --type=json \
        #     -p='[{"op":"replace",
        #           "path":"/spec/template/spec/containers/0/resources/limits/cpu",
        #           "value":"1500m"}]'
        # Tam apply gerekiyorsa ardindan CD'yi yeniden calistirin ya da
        # `set image` ile SHA'yi tekrar pinleyin.
        image: ghcr.io/duosis-developer-team/hermes-core-service:test
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        - containerPort: 9090
          name: metrics
        env:
        # Metrik etiketi 'environment' = KATALOG ANAHTARI ('test'),
        # namespace ('hermes-test') DEGIL.
        - name: HERMES_ENVIRONMENT
          value: "test"
        # Stage 5 promotion: PUBLIC_API_ENV=live → test YALNIZCA
        # hms_live_ token kabul eder (dev token'lari yapisal red).
        # S2S: test'e OZEL hermes-s2s Secret'i (dev degerleri ASLA).
        - name: PUBLIC_API_ENV
          value: "live"
        - name: HERMES_S2S_TOKEN_CURRENT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_CURRENT
        # Database
        - name: CORE_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_CORE
        - name: CORE_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        # RUNTIME ROL (WS1): uygulama artik veritabani superuser'i ile
        # DEGIL, NOBYPASSRLS ve hicbir tablonun sahibi OLMAYAN
        # `hermes_core_app` rolu ile baglanir. Bu adim yapilmadan RLS
        # uygulama icin FIILEN DEVREDE DEGILDIR (superuser onu asar).
        - name: CORE_DB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: CORE_APP_DB_USER
        - name: CORE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: CORE_APP_DB_PASSWORD
        - name: CORE_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_CORE

        # Services & Security
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'

        # Microsoft Graph app credentials (optional — used by Meetings sync
        # and task e-mail notifications). optional:true so a missing secret
        # never blocks the pod; Graph just reports "not configured".
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
              optional: true

        # Task assignment e-mail notifications (Microsoft Graph). Set as
        # literals to mirror the live deployment (applied via `kubectl set
        # env`), so re-applying this manifest keeps mail on and matches the
        # cluster exactly. Flip NOTIFICATIONS_ENABLED to "false" to silence.
        - name: NOTIFICATIONS_ENABLED
          value: "true"
        - name: NOTIF_MAIL_SENDER
          value: hermes@duosis.com
        - name: NOTIF_NOTIFY_ASSIGNER
          value: "true"
        - name: APP_BASE_URL
          value: "https://hermes.duosis.com"

        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          # OLCULEREK ARTIRILDI (2026-08-25). Once 1sn'di, 5sn'ye
          # cikarilmisti; 5sn de yetmedi. hermes-test'te core-service
          # gercek kullanici yuku altinda ~1sa45dk sonra tikandi, liveness
          # 5 kez dustu ve kubelet pod'u OLDURDU (exitCode 137 — OOM
          # DEGIL). Oldurmek durumu KOTULESTIRIYOR: soguk baslangic yuku
          # artiriyor ve dongu kendini besliyor.
          #
          # Sebep bellek DEGILDI: 4 saatlik cgroup ornekleme (865 olcum)
          # en yuksek 219MB/512MB gosterdi ve CPU throttle 77.000
          # periyotta 6'ydi. Probe'un kendisi fazla agresifti.
          #
          # 10sn + 10 esik = gercekten olu bir surec hala yeniden
          # baslatilir (~200sn), ama anlik bir yavaslama saglikli bir
          # pod'u OLDURMEZ.
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          httpGet:
            # /ready sema uyumlulugunu da dogrular: yanlis sema uzerinde
            # calisan bir pod TRAFIK ALMAZ (fail-closed).
            path: /ready
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10

        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1500m"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: core-service
