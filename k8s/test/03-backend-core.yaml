apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: hermes-test
  labels:
    app: core-service
    environment: test
    project: hermes
spec:
  # IKI REPLIKA (2026-08-25): hermes-test production-like'dir ve gercek
  # kullanicilari var. Tek replikada, pod yeniden baslarken (bu kumede
  # Datadog 7 init konteyner enjekte ediyor, aciliş 5-7 dk) servis TAMAMEN
  # kapaniyordu. Ikinci replika, bir pod yenilenirken digerinin hizmet
  # vermesini saglar.
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
        environment: test
      # Prometheus hedef kesfi POD annotation'larindan yapilir — Service
      # uzerine konursa metrik toplanir ama HICBIR ekranda gorunmez
      # (bkz. HERMES_METRICS.md). Port 9090 = uygulama portundan AYRI,
      # yalnizca kume ici; ingress bu porta hicbir yol tasimaz.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: core-service
        # DIKKAT — BU ETIKET YALNIZCA ILK KURULUM ICINDIR.
        # Calisan Deployment her zaman IMMUTABLE SHA'ya pinlenir; bunu
        # CD yapar (`kubectl set image`, bkz. .github/workflows/cd-*.yml).
        # Bu dosyayi OLDUGU GIBI `kubectl apply` etmek, calisan surumu
        # buradaki mutable etikete GERI DONDURUR — 2026-08-06'da canli
        # diff'te yakalandi.
        #
        # Bu yuzden: yalniz bir alani degistirmek gerekiyorsa APPLY DEGIL
        # PATCH kullanin, orn.
        #   kubectl -n <ns> patch deployment core-service --type=json \
        #     -p='[{"op":"replace",
        #           "path":"/spec/template/spec/containers/0/resources/limits/cpu",
        #           "value":"1500m"}]'
        # Tam apply gerekiyorsa ardindan CD'yi yeniden calistirin ya da
        # `set image` ile SHA'yi tekrar pinleyin.
        image: ghcr.io/duosis-developer-team/hermes-core-service:test
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        - containerPort: 9090
          name: metrics
        env:
        # Metrik etiketi 'environment' = KATALOG ANAHTARI ('test'),
        # namespace ('hermes-test') DEGIL.
        - name: HERMES_ENVIRONMENT
          value: "test"
        # Stage 5 promotion: PUBLIC_API_ENV=live → test YALNIZCA
        # hms_live_ token kabul eder (dev token'lari yapisal red).
        # S2S: test'e OZEL hermes-s2s Secret'i (dev degerleri ASLA).
        - name: PUBLIC_API_ENV
          value: "live"
        - name: HERMES_S2S_TOKEN_CURRENT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_CURRENT
        # Database
        - name: CORE_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_CORE
        - name: CORE_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        # RUNTIME ROL (WS1): uygulama artik veritabani superuser'i ile
        # DEGIL, NOBYPASSRLS ve hicbir tablonun sahibi OLMAYAN
        # `hermes_core_app` rolu ile baglanir. Bu adim yapilmadan RLS
        # uygulama icin FIILEN DEVREDE DEGILDIR (superuser onu asar).
        - name: CORE_DB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: CORE_APP_DB_USER
        - name: CORE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: CORE_APP_DB_PASSWORD
        - name: CORE_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_CORE

        # Services & Security
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AUTH_SERVICE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'

        # Microsoft Graph app credentials (optional — used by Meetings sync
        # and task e-mail notifications). optional:true so a missing secret
        # never blocks the pod; Graph just reports "not configured".
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
              optional: true

        # Task assignment e-mail notifications (Microsoft Graph). Set as
        # literals to mirror the live deployment (applied via `kubectl set
        # env`), so re-applying this manifest keeps mail on and matches the
        # cluster exactly. Flip NOTIFICATIONS_ENABLED to "false" to silence.
        - name: NOTIFICATIONS_ENABLED
          value: "true"
        - name: NOTIF_MAIL_SENDER
          value: hermes@duosis.com
        - name: NOTIF_NOTIFY_ASSIGNER
          value: "true"
        - name: APP_BASE_URL
          value: "https://hermes.duosis.com"

        # ------------------------------------------------------------------
        # Ortak urun ticket platformu (Ticket Hub)
        # ------------------------------------------------------------------
        # HEPSI `optional: true`: anahtar ConfigMap'te yoksa pod ACILIR ve
        # modul KAPALI kalir (fail-closed). Manifest ile ConfigMap arasindaki
        # uygulama sirasini kacirmak rollout'u bloklamaz.
        #
        # NOT: bu dosya CANLIYA OLDUGU GIBI APPLY EDILMEZ — apply, calisan
        # Deployment'in immutable SHA image pinini geri alir. Yeni env
        # eklerken `kubectl set env` (additive) kullanilir; bu blok
        # sozlesmenin repo'daki kaydidir.
        - name: SUPPORT_TICKETS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: SUPPORT_TICKETS_ENABLED
              optional: true
        - name: HERMES_SUPPORT_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: HERMES_SUPPORT_TENANT_ID
              optional: true
        - name: SUPPORT_AUTO_CLOSE_DAYS
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: SUPPORT_AUTO_CLOSE_DAYS
              optional: true
        - name: TICKET_ATTACHMENTS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_ATTACHMENTS_ENABLED
              optional: true
        - name: TICKET_STORAGE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_STORAGE_BACKEND
              optional: true
        - name: TICKET_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_S3_ENDPOINT_URL
              optional: true
        - name: TICKET_S3_REGION
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_S3_REGION
              optional: true
        - name: TICKET_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_S3_BUCKET
              optional: true
        - name: TICKET_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: hermes-ticket-storage
              key: TICKET_S3_ACCESS_KEY_ID
              optional: true
        - name: TICKET_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-ticket-storage
              key: TICKET_S3_SECRET_ACCESS_KEY
              optional: true
        - name: TICKET_SCANNER_MODE
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_SCANNER_MODE
              optional: true
        - name: TICKET_SCANNER_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_SCANNER_HOST
              optional: true
        - name: TICKET_WEBHOOK_ALLOW_INSECURE_HTTP
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: TICKET_WEBHOOK_ALLOW_INSECURE_HTTP
              optional: true

        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          # OLCULEREK ARTIRILDI (2026-08-25). Once 1sn'di, 5sn'ye
          # cikarilmisti; 5sn de yetmedi. hermes-test'te core-service
          # gercek kullanici yuku altinda ~1sa45dk sonra tikandi, liveness
          # 5 kez dustu ve kubelet pod'u OLDURDU (exitCode 137 — OOM
          # DEGIL). Oldurmek durumu KOTULESTIRIYOR: soguk baslangic yuku
          # artiriyor ve dongu kendini besliyor.
          #
          # Sebep bellek DEGILDI: 4 saatlik cgroup ornekleme (865 olcum)
          # en yuksek 219MB/512MB gosterdi ve CPU throttle 77.000
          # periyotta 6'ydi. Probe'un kendisi fazla agresifti.
          #
          # 10sn + 10 esik = gercekten olu bir surec hala yeniden
          # baslatilir (~200sn), ama anlik bir yavaslama saglikli bir
          # pod'u OLDURMEZ.
          #
          # 2026-08-28 IKINCI OLAY: 10sn + 10 esik de yetmedi, iki replika
          # da yeniden baslatildi. Bu kez SEBEP OLCULDU ve uygulamada
          # DEGIL: node2'nin PSI degerleri `cpu some=%55`, `io some=%45`,
          # **`io full=%14.7`** — yani zamanin %14'unde node'da hicbir is
          # ilerlemiyor. Pod olurken bile /health ve /ready 200 donuyordu;
          # bellek 265/512MB, CPU throttle 8749 periyotta 2. Yani probe'lar
          # UYGULAMA arizasi degil NODE stall'i olcuyordu ve saglikli
          # pod'lari trafikten alip yeniden baslatarak kesintiyi KENDILERI
          # uretiyordu.
          #
          # 18 esik = ~6 dk. Gercekten kilitlenmis bir surec hala
          # yeniden baslatilir; gecici bir node stall'i artik OLDURMEZ.
          timeoutSeconds: 10
          failureThreshold: 18
        readinessProbe:
          httpGet:
            # /ready sema uyumlulugunu da dogrular: yanlis sema uzerinde
            # calisan bir pod TRAFIK ALMAZ (fail-closed).
            path: /ready
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          # failureThreshold ACIKCA verilir: varsayilan 3'tur ve 30 sn
          # sonra pod'u trafikten alir. 2026-08-28'de kesintiyi buyuten
          # sey buydu — node stall'i 30 sn'yi asinca ONCE node2'deki
          # replika trafikten cikti, tum yuk node1'dekine bindi ve o da
          # ayni sekilde dustu. 6 esik = 60 sn tolerans.
          failureThreshold: 6

        resources:
          requests:
            memory: "128Mi"
            # 250m -> 500m: CFS payi request ile ORANTILIDIR. node2'de
            # kubelet + gozlemlenebilirlik agent'lari CPU'yu doyurdugunda
            # daha yuksek request, cekismede daha buyuk pay demektir.
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1500m"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: hermes-test
  labels:
    environment: test
    project: hermes
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: core-service
