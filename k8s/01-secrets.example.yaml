# =============================================================================
# EXAMPLE ONLY — DO NOT APPLY DIRECTLY
# =============================================================================
# Bu dosya hermes-secrets nesnesinin KEY SOZLESMESINI belgeler. Gercek
# degerler Git'te TUTULMAZ (Sprint 0 containment karari, 2026-07-29).
# Calisan cluster'daki mevcut Secret degistirilmeden kullanilmaya devam
# eder; bu sablonu apply etmek CALISAN DEGERLERI EZEBILIR.
#
# Yeni ortam kurulumu/kurtarma: docs/security/runtime-secret-contract.md
# Varlik kontrolu (deger okumadan): scripts/k8s/check-runtime-secrets.sh hermes-dev
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes-dev
type: Opaque
stringData:
  POSTGRES_PASSWORD: REQUIRED_FROM_OPERATOR
  JWT_SECRET_KEY: REQUIRED_FROM_OPERATOR
  AZURE_CLIENT_SECRET: REQUIRED_FROM_OPERATOR
  RABBITMQ_PASSWORD: REQUIRED_FROM_OPERATOR
---
# =============================================================================
# EXAMPLE ONLY — Ticket attachment object storage credential'lari
# =============================================================================
# S3 uyumlu depo (MinIO/S3/R2). `TICKET_ATTACHMENTS_ENABLED=true` VE
# `TICKET_STORAGE_BACKEND=s3` iken ZORUNLU. Eksikse /ready dusmez
# (ozellik kapaliysa) ama ozellik aciksa pod trafige ALINMAZ.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-ticket-storage
  namespace: hermes-dev
type: Opaque
stringData:
  TICKET_S3_ACCESS_KEY_ID: REQUIRED_FROM_OPERATOR
  TICKET_S3_SECRET_ACCESS_KEY: REQUIRED_FROM_OPERATOR
---
# =============================================================================
# EXAMPLE ONLY — Kume ici MinIO (yalnizca k8s/test/10-minio.yaml kullanildiginda)
# =============================================================================
# MINIO_KMS_SECRET_KEY ZORUNLUDUR: Hermes'in S3 istemcisi her PUT'ta
# `x-amz-server-side-encryption: AES256` gonderir ve MinIO bu istegi KMS
# anahtari YOKKEN yok saymaz — 501 NotImplemented doner, yukleme komple
# basarisiz olur. Bicim: "<anahtar-adi>:<base64 32 bayt>".
#
# DIKKAT: anahtar kaybolursa sifreli nesneler COZULEMEZ.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-minio-root
  namespace: hermes-test
type: Opaque
stringData:
  MINIO_ROOT_USER: REQUIRED_FROM_OPERATOR
  MINIO_ROOT_PASSWORD: REQUIRED_FROM_OPERATOR
  MINIO_KMS_SECRET_KEY: REQUIRED_FROM_OPERATOR
---
# =============================================================================
# EXAMPLE ONLY — Giden webhook imzalama sirlari
# =============================================================================
# Anahtar KALIBI: HERMES_TICKET_WEBHOOK_SECRET__<APPLICATION_CODE_UPPER>
# (tire yerine alt cizgi). Rotasyon icin `_NEXT` slotu: consumer yeni
# sirri kabul etmeye baslayana kadar imza CURRENT ile atilir, sonra
# slotlar takas edilir — kesinti olmaz.
#
# Sir tanimli DEGILSE o uygulamanin olaylari GONDERILMEZ. Imzasiz
# gonderme yolu YOKTUR (05 §7).
apiVersion: v1
kind: Secret
metadata:
  name: hermes-ticket-webhooks
  namespace: hermes-dev
type: Opaque
#
# `_NEXT` slotu ROTASYON SIRASINDA doldurulur; normal isleyiste
# GEREKMEZ. Gercek Secret'ta anahtar hic bulunmayabilir — kod bos/eksik
# degeri "rotasyon yok" olarak okur. Sablonda placeholder tasir cunku
# secret containment guard'i her anahtarin ACIK placeholder olmasini
# ister (bos deger, unutulmus gercek bir degerden ayirt edilemezdi).
stringData:
  HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT: REQUIRED_FROM_OPERATOR
  HERMES_TICKET_WEBHOOK_SECRET__LOGISLOT_NEXT: REQUIRED_FROM_OPERATOR
