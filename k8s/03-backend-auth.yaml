apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hermes-dev
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      # Prometheus hedef kesfi POD annotation'larindan yapilir (Service
      # uzerinde ETKISIZ olur — bkz. HERMES_METRICS.md).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: auth-service
        image: ghcr.io/duosis-developer-team/hermes-auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        - containerPort: 9090
          name: metrics
        env:
        # Metrik etiketi 'environment' = KATALOG ANAHTARI ('dev'),
        # namespace DEGIL (ConfigMap'teki ENVIRONMENT burada "production").
        - name: HERMES_ENVIRONMENT
          value: "dev"
        # Database Connection
        - name: AUTH_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_HOST_AUTH
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: DB_PORT
        # WS1 — RUNTIME ROLU (superuser DEGIL).
        # Uygulama artik `hermes` superuser'i ile baglanmaz: o rol
        # RLS'i asar ve tenant izolasyonunu anlamsiz kilardi. Bu kimlik
        # NOBYPASSRLS'tir ve hicbir tablonun sahibi degildir.
        # Kurulum: backend/sql_scripts/roles/README.md
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: AUTH_APP_DB_USER
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-db-roles
              key: AUTH_APP_DB_PASSWORD
        - name: AUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: POSTGRES_DB_AUTH
        
        
        # Security
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: JWT_SECRET_KEY
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_CLIENT_ID
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: hermes-config
              key: AZURE_TENANT_ID
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: AZURE_CLIENT_SECRET
        
        - name: CORS_ORIGINS
          value: '["http://localhost:3000", "http://localhost:5173", "https://84.247.180.172:30772", "http://84.247.180.172:30772", "https://84.247.180.172:30443", "http://84.247.180.172:30443", "https://hermes.duosis.com"]'
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PUBLIC_KEY
        # Stage 5B-2: internal directory S2S anahtarlari (dual-key
        # rotasyon). Optional: secret eklenene kadar rollout bloklanmaz;
        # bos = internal directory kapali (fail closed).
        - name: HERMES_S2S_TOKEN_CURRENT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_CURRENT
              optional: true
        - name: HERMES_S2S_TOKEN_NEXT
          valueFrom:
            secretKeyRef:
              name: hermes-s2s
              key: HERMES_S2S_TOKEN_NEXT
              optional: true
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-jwt-auth
              key: JWT_PRIVATE_KEY

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        # WS10: readiness sema uyumlulugunu DA kontrol eder.
        # Liveness BILEREK /health'te kalir — yanlis sema pod'u
        # yeniden baslatmaz (bu crashloop olurdu), yalnizca
        # trafikten alir.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hermes-dev
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: auth-service
