# =============================================================================
# HERMES — Sema migration Job'i (WS1)
# =============================================================================
# NEDEN AYRI BIR JOB: sema degisiklikleri artik uygulama startup'inda
# yapilmiyor (yarisan podlar sorunu). Bu Job, rollout'tan ONCE kosar ve
# BASARISIZ OLURSA rollout HIC BASLAMAZ.
#
# SABLON: bu dosya oldugu gibi apply EDILMEZ. `${IMAGE_TAG}` ve
# `${JOB_NAME}` degiskenleri doldurulur:
#
#   scripts/k8s/run-migration-job.sh hermes-dev <sha>
#
# CD bunu otomatik yapar (.github/workflows/cd-dev.yml → `migrate` job'i).
# Elle calistirma (Termius'tan) icin de ayni betik kullanilir.
#
# KIMLIK: Job, MIGRATOR rolunu kullanir (tablo sahibi, BYPASSRLS).
# Uygulama pod'lari bu credential'i ASLA gormez — onlar NOBYPASSRLS ve
# tablo sahibi OLMAYAN app rolunu kullanir. Bkz.
# backend/sql_scripts/roles/00_roles.sql
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: hermes-migration
    hermes.duosis.com/component: schema-migration
spec:
  # Migration idempotenttir ama sinirsiz retry, bozuk bir revizyonda
  # sonsuz dongu demektir. Iki deneme + acik hata daha iyidir.
  backoffLimit: 2
  # Bitmis Job'lar 24 saat sonra kendini toplar (log incelemesi icin sure).
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: hermes-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-secret
      # -----------------------------------------------------------------
      # SIRA: once auth, sonra core. Ilk tenant auth_db'de URETILIR (auth
      # 0003); core'un backfill'i (0004) o UUID'yi kullanir. initContainer
      # bitmeden ana konteyner BASLAMAZ — sira k8s tarafindan garanti
      # edilir, betikte degil.
      #
      # NEDEN IKI IMAGE: her image YALNIZCA kendi servisinin
      # `app/migrations/` dizinini tasir (Dockerfile `<svc>/app/` -> `./app/`
      # kopyalar). Tek image'la `all` kosmak canlida basarisiz oldu:
      # "Alembic script dizini bulunamadi: /app/auth-service/app/migrations".
      # Her servis KENDI image'iyla kosar; `shared.migration_runner` ayrica
      # `HERMES_SERVICE` damgasini dogrular.
      # -----------------------------------------------------------------
      initContainers:
        - name: migrate-auth
          image: ghcr.io/duosis-developer-team/hermes-auth-service:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "shared.migration_runner", "auth"]
          env:
            - name: HERMES_AUTH_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-db-roles
                  key: AUTH_MIGRATION_DATABASE_URL
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-jwt-public
                  key: JWT_PUBLIC_KEY
            - name: HERMES_ENVIRONMENT
              value: "${HERMES_ENVIRONMENT}"
            # Ilk tenant BURADA yaratilir (auth 0003). Slug degistirilirse
            # YENI bir tenant olusur — mevcut veri eskisinde kalir.
            - name: HERMES_INITIAL_TENANT_SLUG
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: INITIAL_TENANT_SLUG
                  optional: true
            - name: HERMES_INITIAL_TENANT_NAME
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: INITIAL_TENANT_NAME
                  optional: true
            # Ilk tenant'in saat dilimi. Varsayilan Europe/Istanbul'dur;
            # anahtar yoksa o kullanilir (optional).
            - name: HERMES_INITIAL_TENANT_TIMEZONE
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: INITIAL_TENANT_TIMEZONE
                  optional: true
            - name: HERMES_INITIAL_TENANT_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: INITIAL_TENANT_HOSTNAME
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          # core image'i — YALNIZCA core migration'lari. Uygulama koduyla
          # AYNI SHA'ya pinlenir ki sema ve kod ayni surumden gelsin.
          image: ghcr.io/duosis-developer-team/hermes-core-service:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "shared.migration_runner", "core"]
          env:
            # ---------------------------------------------------------
            # Migrator baglanti URL'leri — TAM URL secret'tan gelir.
            # Sifre hicbir ConfigMap'te/argumanda gorunmez.
            # ---------------------------------------------------------
            - name: HERMES_AUTH_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-db-roles
                  key: AUTH_MIGRATION_DATABASE_URL
            - name: HERMES_CORE_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-db-roles
                  key: CORE_MIGRATION_DATABASE_URL
            # shared/auth.py modul yuklenirken JWT_PUBLIC_KEY yoksa
            # sys.exit(1) yapar; migration imza dogrulamaz ama import
            # zinciri bu anahtari ister.
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-jwt-public
                  key: JWT_PUBLIC_KEY
            - name: HERMES_ENVIRONMENT
              value: "${HERMES_ENVIRONMENT}"
            # Ilk tenant kimligi (WS3): auth adimi tenant'i BIR KEZ
            # yaratir; core burada onu auth_db'den SORGULAR (yukaridaki
            # AUTH_MIGRATION_DATABASE_URL bunun icin gerekli). UUID
            # core'da URETILMEZ — tek dogruluk kaynagi auth_db'dir.
            - name: HERMES_INITIAL_TENANT_SLUG
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: INITIAL_TENANT_SLUG
                  optional: true
            # Enforce fazi bu role EXECUTE/DML yetkisi verir.
            - name: HERMES_CORE_APP_ROLE
              valueFrom:
                secretKeyRef:
                  name: hermes-db-roles
                  key: CORE_APP_DB_USER
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
