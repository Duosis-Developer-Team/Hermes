# INGRESS SAHIPLIK MODELI (Stage 5, CTO karari):
#   BU kaynak → uygulama route'lari: / · /api/v1/auth · /api/v1/users ·
#   /api/v1/reports · /api/v1 · /api/public
#   MCP route'lari (/mcp, /.well-known/oauth-protected-resource) BU
#   DOSYADA YER ALMAZ — onlar 09-mcp-ingress'e aittir. ingress-nginx
#   ayni host'un iki Ingress'ini tek server blogunda birlestirir; sart:
#   ayni (host,path) iki kaynakta olmayacak + ayni ingressClass + ayni
#   TLS secret. Kilit: mcp-service/tests/test_stage5d_ingress_ownership.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
  - hosts:
    - 84.247.180.172
    secretName: hermes-tls
  ingressClassName: nginx
  rules:
  - host: 84.247.180.172
    http:
      paths:
      # Auth Service Routes
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      # Platform Admin duzlemi (WS9) — AYRI guvenlik duzlemi.
      # Tenant API'siyle ayni servise gider ama farkli audience
      # (`hermes-platform-admin`) ve ayri cerez kullanir; tenant token'i
      # burada, platform token'i tenant uclarinda REDDEDILIR.
      #
      # Bu kural olmadan istek frontend'in nginx'ine duser ve POST icin
      # 405 doner — Platform Console tarayicidan ERISILEMEZ olur.
      # Canlida birebir boyle bulundu.
      - path: /api/platform
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
              
      # Reporting Service Routes
      - path: /api/v1/reports
        pathType: Prefix
        backend:
          service:
            name: reporting-service
            port:
              number: 80
              
      # Core Service Routes (Catch-all for API)
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80

      # Public API (external integrations) — core-service'teki izole
      # /api/public alt-uygulamasina gider. Bu kural olmadan /api/public
      # SPA catch-all'ina duser ve index.html doner.
      - path: /api/public
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80
              
      # Frontend (Root)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
