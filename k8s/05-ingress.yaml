# ⚠️ CANLI DRIFT UYARISI (2026-08-25 olcumu, hermes-dev):
#   Bu dosya CANLI `hermes-ingress` ile AYNI DEGILDIR ve OLDUGU GIBI
#   APPLY EDILMEMELIDIR. Olculen farklar:
#     - burada `host: 84.247.180.172` var; K8s bunu REDDEDER
#       ("must be a DNS name, not an IP address") — apply dogrulamada
#       patlar. Canlida host YOKTUR (tum host'lar).
#     - canlida `/api/v1/core` kurali VAR, burada YOK.
#     - canlida `/mcp` ve `/.well-known/oauth-protected-resource`
#       kurallari AYNI Ingress icinde; bu dosya onlarin
#       09-mcp-ingress'e ait oldugunu varsayar.
#   Yani blind apply MCP'yi ve core route'unu SILERDI.
#
#   Yeni bir route eklerken (orn. /api/integrations) CANLIYA ADDITIVE
#   PATCH atilir:
#     kubectl -n hermes-dev patch ingress hermes-ingress --type=json \
#       -p '[{"op":"add","path":"/spec/rules/0/http/paths/-","value":{...}}]'
#   Bu dosyayi canliyla uzlastirmak, davranis degistirmeyen AYRI bir
#   bakim commit'i bekliyor (k8s/test/05-ingress.yaml ile ayni durum).
#
# INGRESS SAHIPLIK MODELI (Stage 5, CTO karari):
#   BU kaynak → uygulama route'lari: / · /api/v1/auth · /api/v1/users ·
#   /api/v1/reports · /api/v1 · /api/public · /api/integrations
#   MCP route'lari (/mcp, /.well-known/oauth-protected-resource) BU
#   DOSYADA YER ALMAZ — onlar 09-mcp-ingress'e aittir. ingress-nginx
#   ayni host'un iki Ingress'ini tek server blogunda birlestirir; sart:
#   ayni (host,path) iki kaynakta olmayacak + ayni ingressClass + ayni
#   TLS secret. Kilit: mcp-service/tests/test_stage5d_ingress_ownership.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes-dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
  - hosts:
    - 84.247.180.172
    secretName: hermes-tls
  ingressClassName: nginx
  rules:
  - host: 84.247.180.172
    http:
      paths:
      # Auth Service Routes
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      # Platform Admin duzlemi (WS9) — AYRI guvenlik duzlemi.
      # Tenant API'siyle ayni servise gider ama farkli audience
      # (`hermes-platform-admin`) ve ayri cerez kullanir; tenant token'i
      # burada, platform token'i tenant uclarinda REDDEDILIR.
      #
      # Bu kural olmadan istek frontend'in nginx'ine duser ve POST icin
      # 405 doner — Platform Console tarayicidan ERISILEMEZ olur.
      # Canlida birebir boyle bulundu.
      - path: /api/platform
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
              
      # Reporting Service Routes
      - path: /api/v1/reports
        pathType: Prefix
        backend:
          service:
            name: reporting-service
            port:
              number: 80
              
      # Core Service Routes (Catch-all for API)
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80

      # Public API (external integrations) — core-service'teki izole
      # /api/public alt-uygulamasina gider. Bu kural olmadan /api/public
      # SPA catch-all'ina duser ve index.html doner.
      - path: /api/public
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80

      # Support integration API — core-service'teki izole
      # /api/integrations alt-uygulamasi (kaynak uygulamalarin ticket
      # ingress'i). Bu kural OLMADAN istek SPA catch-all'ina duser ve
      # LogiSlot bir JSON yerine index.html alir — 200 donen, sessizce
      # yanlis bir cevap. Public API'nin ayni nedenle ayri bir kurali
      # var.
      - path: /api/integrations
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 80

      # Frontend (Root)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
