<title>Hermes Liquid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* =============================================================================
   HERMES LIQUID — tasarim sistemi (prototip)
   Hermes paleti (frontend/src/styles/tokens.css hp-*) + sivi zemin + liquid glass
   ============================================================================= */
:root{
  --blue-300:#85B8FF; --blue-400:#579DFF; --blue-500:#388BFF; --blue-600:#0C66E4; --blue-700:#0055CC;
  --purple-300:#B8ACF6; --purple-500:#8F7EE7;
  --green-300:#4BCE97; --green-500:#22A06B; --green-700:#1F845A;
  --amber-300:#F5CD47; --amber-500:#E2B203; --amber-700:#946F00;
  --red-300:#F87168; --red-500:#E2483D; --red-700:#C9372C;

  /* Hermes zemini: uzay siyahi + koyu lacivert sivi — IKI temada da ayni.
     Tema yalniz yuzeyleri degistirir: acik = beyaz buzlu cam, koyu = koyu cam. */
  /* ACIK: tamamen seffaf, acik tonlu sivi (inci/gumus + Hermes mavisi).
     Kartlar opak degil, sivinin ustunde yuzen buzlu cam. */
  --base:#E6EAF0;
  --liquid-bg:radial-gradient(120% 90% at 50% 0%, #DCE8FA 0%, #C3D4EE 55%, #B7C6E0 100%);
  --blob-a:rgba(56,139,255,.7); --blob-b:rgba(143,126,231,.62); --blob-c:rgba(75,206,151,.38);
  --blob-d:rgba(255,255,255,.95); --blob-e:rgba(12,102,228,.45); --blob-m:rgba(133,184,255,.6);
  /* Kabuk (uygulama cercevesi): sivinin ustunde BEYAZ SEFFAF cam */
  --shell:rgba(255,255,255,.34); --shell-edge:rgba(255,255,255,.7); --shell-rim:rgba(255,255,255,.22);
  --shell-shadow:0 40px 90px -40px rgba(20,40,90,.45);
  --bezel:rgba(255,255,255,.26); --bezel-line:rgba(255,255,255,.7); --bezel-in:rgba(17,23,32,.04);
  --nav-bg:rgba(255,255,255,.42); --nav-edge:rgba(255,255,255,.75); --nav-ink:#111720; --nav-ink-2:#3E4A5C; --nav-2:rgba(17,23,32,.06); --nav-ind:#FFFFFF; --nav-on:#0E131B;
  --on-bg:#0E131B; --on-bg-2:#526174;
  --seg-bg:rgba(17,23,32,.06);
  --glass: rgba(255,255,255,.3);
  --glass-strong: rgba(255,255,255,.55); --pop-bg: rgba(250,252,255,.94);
  --glass-edge: rgba(255,255,255,.75);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 0 0 .5px rgba(255,255,255,.4) inset, 0 20px 40px -24px rgba(40,60,100,.35), 0 2px 6px rgba(40,60,100,.06);
  --dock-bg:rgba(255,255,255,.4); --dock-edge:rgba(255,255,255,.8);
  --hair: rgba(17,23,32,.08);
  --hair-2: rgba(17,23,32,.12);
  --fill: rgba(17,23,32,.045);
  --fill-2: rgba(17,23,32,.08);
  --ink:#111720; --ink-2:#526174; --ink-3:#78869A;
  --primary:var(--blue-600); --primary-2:var(--blue-500); --on-primary:#FFFFFF;
  --grad: linear-gradient(135deg, var(--blue-400), var(--blue-600));
  --ok:var(--green-700); --ok-bg:rgba(34,160,107,.13);
  --warn:var(--amber-700); --warn-bg:rgba(226,178,3,.16);
  --bad:var(--red-700); --bad-bg:rgba(226,72,61,.12);
  --info:var(--blue-600); --info-bg:rgba(12,102,228,.1);
  --violet:#6E5DD3; --violet-bg:rgba(143,126,231,.16);
  --island:#0E131B; --island-ink:#F4F7FB; --island-ink-2:#8E9AAE; --island-2:rgba(255,255,255,.08);
  --sans:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
/* Varsayilan ACIK sivi zemin (CTO: "arkaplan koyu olmasin"); koyu tema yalniz
   profil menusunden secilince. */
:root[data-theme="dark"]{
  /* KOYU: uzay grisi + uzay siyahi sivi; canli mavi yok. */
  color-scheme: dark;
  --base:#07080A;
  --liquid-bg:radial-gradient(120% 90% at 50% 0%, #2A2E36 0%, #15171C 55%, #0A0B0D 100%);
  --blob-a:rgba(110,118,134,.85); --blob-b:rgba(44,52,70,.95); --blob-c:rgba(150,156,170,.45);
  --blob-d:rgba(12,14,18,.95); --blob-e:rgba(70,90,125,.6); --blob-m:rgba(160,168,185,.3);
  --shell:rgba(6,7,9,.36); --shell-edge:rgba(255,255,255,.1); --shell-rim:rgba(0,0,0,.32);
  --shell-shadow:0 40px 90px -30px rgba(0,0,0,.8);
  --bezel:rgba(0,0,0,.28); --bezel-line:rgba(255,255,255,.1); --bezel-in:rgba(255,255,255,.03);
  --nav-bg:rgba(255,255,255,.07); --nav-edge:rgba(255,255,255,.12); --nav-ink:#EEF1F5; --nav-ink-2:#B4BAC5; --nav-2:rgba(255,255,255,.08); --nav-ind:#F4F7FB; --nav-on:#0B0C0E;
  --on-bg:#EDEFF3; --on-bg-2:#8D94A1;
  --seg-bg:rgba(255,255,255,.07);
  --glass: rgba(34,38,46,.34); --glass-strong: rgba(34,37,44,.66); --pop-bg: rgba(26,28,33,.95); --glass-edge: rgba(255,255,255,.09);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 20px 40px -26px rgba(0,0,0,.7);
  --dock-bg:rgba(20,22,27,.5); --dock-edge:rgba(255,255,255,.1);
  --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.14);
  --fill: rgba(255,255,255,.05); --fill-2: rgba(255,255,255,.09);
  --ink:#EEF1F5; --ink-2:#A6ADBA; --ink-3:#737A87;
  --primary:var(--blue-400); --primary-2:var(--blue-300); --on-primary:#06101F;
  --ok:var(--green-300); --ok-bg:rgba(75,206,151,.14);
  --warn:var(--amber-300); --warn-bg:rgba(245,205,71,.13);
  --bad:var(--red-300); --bad-bg:rgba(248,113,104,.14);
  --info:var(--blue-300); --info-bg:rgba(87,157,255,.14);
  --violet:var(--purple-300); --violet-bg:rgba(184,172,246,.15);
  --island:#050607; --island-2:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--base);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Sivi zemin ---------- */
.liquid{position:fixed;inset:-12%;z-index:0;pointer-events:none;filter:blur(56px) saturate(1.25);overflow:hidden;background:var(--liquid-bg)}
.blob{position:absolute;border-radius:42% 58% 63% 37% / 43% 38% 62% 57%;will-change:transform,border-radius;animation:morph 26s var(--ease) infinite alternate}
.b1{width:48vw;height:48vw;left:-6vw;top:-8vw;background:var(--blob-a);animation-duration:28s}
.b2{width:42vw;height:42vw;right:-8vw;top:6vh;background:var(--blob-b);animation-duration:33s;animation-delay:-9s}
.b3{width:38vw;height:38vw;left:24vw;bottom:-14vw;background:var(--blob-c);animation-duration:30s;animation-delay:-4s}
.b4{width:30vw;height:30vw;right:18vw;bottom:-6vw;background:var(--blob-d);animation-duration:24s;animation-delay:-14s}
.b5{width:18vw;height:18vw;left:44vw;top:10vh;background:var(--blob-e);animation-duration:21s}
.bm{width:30vw;height:30vw;background:var(--blob-m);left:0;top:0;transform:translate(var(--mx,40vw),var(--my,40vh));transition:transform 2.4s var(--ease);animation:none;border-radius:50%}
@keyframes morph{
  0%{transform:translate(0,0) rotate(0) scale(1);border-radius:42% 58% 63% 37% / 43% 38% 62% 57%}
  50%{transform:translate(6vw,4vh) rotate(40deg) scale(1.12);border-radius:61% 39% 44% 56% / 58% 51% 49% 42%}
  100%{transform:translate(-4vw,8vh) rotate(-30deg) scale(.94);border-radius:37% 63% 51% 49% / 37% 58% 42% 63%}
}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Cam ---------- */
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.app{position:relative;z-index:1;margin:0;min-height:100vh;padding:0 max(16px, calc((100vw - 1440px) / 2)) 120px;
  background:var(--shell);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.bezel{position:fixed;inset:10px;z-index:45;pointer-events:none;border-radius:30px;border:1px solid var(--bezel-line);box-shadow:0 0 0 12px var(--bezel), inset 0 0 0 1px var(--bezel-in)}
@media (max-width:760px){.bezel{inset:6px;border-radius:22px;box-shadow:0 0 0 8px var(--bezel), inset 0 0 0 1px var(--bezel-in)}}
.app .glass{backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}


/* ---------- Ada (dynamic island) ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:center;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:10px;pointer-events:none}
.island{pointer-events:auto;position:relative;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:var(--nav-bg);color:var(--nav-ink);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--nav-edge);
  box-shadow:0 10px 30px -16px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.2) inset;transition:border-radius .45s var(--spring), padding .45s var(--spring), width .45s var(--spring);max-width:100%}
.brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--nav-ink);padding:0 12px 0 0;border-radius:999px;flex:none;transition:background .2s}
.brand:hover{background:var(--nav-2)}
.brand .wm{font-weight:650;font-size:15px;letter-spacing:-.02em}
.logo{position:relative;width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;border:0;overflow:hidden;
  background:radial-gradient(120% 120% at 30% 20%, #3A404C 0%, #161A21 55%, #07080A 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), inset 0 1px 0 rgba(255,255,255,.25)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 6s var(--ease) infinite}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

.tabs{position:relative;display:flex;gap:2px}
.tabs .ind{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--nav-ind);box-shadow:0 2px 8px rgba(0,0,0,.18);transition:left .45s var(--spring), width .45s var(--spring);z-index:0}
.tabs button{position:relative;z-index:1;border:0;background:transparent;color:var(--nav-ink-2);padding:9px 14px;border-radius:999px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .25s}
.tabs button:hover{color:var(--nav-ink)}
.tabs button.on{color:var(--nav-on)}
.tabs svg{width:16px;height:16px;flex:none}
.isep{width:1px;height:22px;background:var(--hair-2);margin:0 4px;flex:none}
.iconb{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--nav-ink-2);display:grid;place-items:center;position:relative;flex:none;transition:background .2s,color .2s}
.iconb:hover{background:var(--nav-2);color:var(--nav-ink)}
.iconb svg{width:18px;height:18px}
.iconb .cnt{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--blue-500);color:#fff;font:600 10px/16px var(--sans);padding:0 4px;text-align:center}
.live{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--nav-2);color:var(--nav-ink);padding:7px 12px 7px 9px;white-space:nowrap;flex:none}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--green-300);box-shadow:0 0 0 0 rgba(75,206,151,.6);animation:ping 1.8s infinite}
.live.meet .dot{background:var(--blue-400)}
.live .t{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.live .l{color:var(--nav-ink-2);font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(75,206,151,0)}100%{box-shadow:0 0 0 0 rgba(75,206,151,0)}}
.me{width:36px;height:36px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--blue-400),var(--purple-500));color:#fff;font-weight:700;font-size:12.5px;flex:none}
/* Adanin genisleyen yuzu */
.drop{--d-bg:var(--glass-strong);--d-ink:var(--ink);--d-ink-2:var(--ink-3);--d-2:var(--fill);--d-3:var(--fill-2);--d-line:var(--hair);
  position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%) translateY(-6px) scale(.96);transform-origin:top center;width:min(560px, calc(100vw - 32px));opacity:0;pointer-events:none;
  background:var(--d-bg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-edge);color:var(--d-ink);border-radius:24px;padding:10px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);transition:opacity .18s, transform .38s var(--spring)}
.drop.dark{--d-bg:rgba(2,5,10,.94);--d-ink:var(--island-ink);--d-ink-2:var(--island-ink-2);--d-2:rgba(255,255,255,.07);--d-3:rgba(255,255,255,.12);--d-line:rgba(255,255,255,.08);border-color:rgba(255,255,255,.08);padding:18px;width:min(460px,calc(100vw - 32px))}
.drop.narrow{width:min(340px,calc(100vw - 32px));left:auto;right:0;transform:translateY(-6px) scale(.96);transform-origin:top right}
.drop.narrow.open{transform:none}
.drop.open{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.drop h5{margin:10px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--d-ink-2);font-weight:600}
.cmdk{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--d-line);padding:6px 10px 12px;margin-bottom:4px}
.cmdk svg{width:18px;height:18px;color:var(--d-ink-2);flex:none}
.cmdk input{flex:1;background:transparent;border:0;outline:none;color:var(--d-ink);font-size:15.5px}
.cmdk input::placeholder{color:var(--d-ink-2)}
.kbd{font:500 11px var(--mono);border:1px solid var(--d-line,rgba(255,255,255,.16));background:var(--d-2,transparent);border-radius:6px;padding:1px 6px;color:var(--d-ink-2,var(--island-ink-2))}







.results{display:flex;flex-direction:column;gap:1px;max-height:360px;overflow:auto}
.results button{border:0;background:transparent;color:var(--d-ink);display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;text-align:left;font-size:13.5px}
.results .ri{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--d-2);color:var(--d-ink-2);flex:none}
.results .ri svg{width:15px;height:15px}
.results button:hover,.results button.sel{background:var(--d-3)}
.results button.sel .ri{background:var(--primary);color:#fff}
.results .k{font:500 11.5px var(--mono);color:var(--d-ink-2)}
.results .ty{margin-left:auto;font-size:11.5px;color:var(--d-ink-2)}
.cmd-foot{display:flex;gap:14px;align-items:center;border-top:1px solid var(--d-line);margin-top:6px;padding:10px 10px 4px;font-size:11.5px;color:var(--d-ink-2)}
.timer-big{font:500 48px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.drop .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ibtn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:var(--d-2,var(--island-2));color:var(--d-ink,var(--island-ink))}
.ibtn.pri{background:var(--d-ink,var(--island-ink));color:var(--d-bg,var(--island))}
.drop:not(.dark) .ibtn.pri{background:var(--primary);color:#fff}
.notif{display:flex;gap:12px;padding:10px;border-radius:14px;align-items:flex-start}
.notif:hover{background:var(--d-2)}
.notif .nd{width:8px;height:8px;border-radius:50%;background:var(--blue-400);margin-top:6px;flex:none}
.notif.read .nd{background:transparent}
.notif p{margin:0;font-size:13px}
.notif small{color:var(--d-ink-2)}




/* Ada bildirimi (toast adadan akar) */
.island.toasting{border-radius:26px}
.itoast{display:none;align-items:center;gap:10px;padding:4px 10px 4px 6px;white-space:nowrap}
.island.toasting .itoast{display:flex}
.island.toasting > :not(.itoast):not(.drop){display:none}
.itoast .ok{width:26px;height:26px;border-radius:50%;background:var(--green-500);display:grid;place-items:center}
.itoast .ok svg{width:14px;height:14px;color:#fff}


/* ---------- Profil kartı ---------- */
.prof-h{display:flex;align-items:center;gap:12px;padding:8px 8px 12px}
.prof-h .me{width:46px;height:46px;font-size:15px}
.prof-h b{display:block;font-size:15px}
.prof-h small{color:var(--d-ink-2)}
.prof-role{margin-left:auto}
.psec{border-top:1px solid var(--d-line);padding:8px 2px}
.psec h6{margin:4px 8px 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--d-ink-2);font-weight:600}
.prow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--d-ink);padding:8px;border-radius:12px;text-align:left;font-size:13.5px}
.prow:hover{background:var(--d-2)}
.prow .pi{width:28px;height:28px;border-radius:9px;background:var(--d-2);display:grid;place-items:center;flex:none;color:var(--d-ink-2)}
.prow .pi svg{width:15px;height:15px}
.prow .end{margin-left:auto;color:var(--d-ink-2);font-size:12px;display:flex;align-items:center;gap:6px}
.prow.org .oav{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 11px var(--sans);color:#fff;flex:none}
.prow .chk{color:var(--primary)}
.prow.danger{color:var(--bad)}
.prow.danger .pi{background:var(--bad-bg);color:var(--bad)}
.iseg{display:inline-flex;background:var(--d-2);border-radius:999px;padding:3px;gap:2px}
.iseg button{border:0;background:transparent;color:var(--d-ink-2);border-radius:999px;padding:5px 11px;font-size:12.5px;display:flex;align-items:center;gap:5px}
.iseg button svg{width:13px;height:13px}
.iseg button.on{background:var(--glass-strong);color:var(--d-ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.drop.dark .iseg button.on{background:var(--island-ink);color:var(--island)}
.nhead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px}
.nhead b{font-size:15px}
.nhead button{border:0;background:transparent;color:var(--primary);font-weight:600;font-size:12.5px}
.notif{display:flex;gap:10px;padding:10px 8px;border-radius:14px;align-items:flex-start}
.notif .nav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 10.5px var(--sans);color:#fff;flex:none}
.notif .nd{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:11px;flex:none}
.notif.read .nd{visibility:hidden}

/* ---------- Alt dock (macOS mantigi: ikincil moduller + hizli eylemler) ---------- */
.mdock-d{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;border-radius:24px;
  background:var(--dock-bg);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--dock-edge);box-shadow:0 20px 50px -20px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.5) inset}
.mdock-d .di{position:relative;width:44px;height:44px;border:0;border-radius:13px;display:grid;place-items:center;color:#fff;transform-origin:bottom center;transition:width .18s var(--ease), height .18s var(--ease);flex:none}

.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.enter > *{animation:rise .6s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}.enter > *:nth-child(6){animation-delay:.25s}.enter > *:nth-child(7){animation-delay:.3s}.enter > *:nth-child(8){animation-delay:.35s}
@keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
::view-transition-old(main){animation:vt-out .22s var(--ease) both}
::view-transition-new(main){animation:vt-in .42s var(--ease) both}

.a-effort{grid-column:span 8}.a-focus{grid-column:span 4}.a-work{grid-column:span 7}.a-cal{grid-column:span 5}.a-team{grid-column:span 7}.a-org{grid-column:span 5}
.fill{flex:1;display:flex;flex-direction:column;min-height:0}
.foot-line{margin-top:auto;padding-top:12px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.eff{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:22px;align-items:center}
.estats{display:flex;flex-direction:column;gap:12px}
.estats div{display:flex;flex-direction:column}
.estats b{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.estats span{font-size:12px;color:var(--ink-3)}
.fsig{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--fill);border:0;width:100%;text-align:left;transition:background .2s, transform .25s var(--spring)}
.fsig + .fsig{margin-top:8px}
.fsig:hover{background:var(--fill-2);transform:translateX(3px)}
.fsig .fi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.fsig b{display:block;font-size:13.5px}
.fsig small{color:var(--ink-3);font-size:12px}
.mini{display:flex;gap:3px;align-items:flex-end;height:22px}
.mini i{width:6px;border-radius:2px;background:var(--red-500);opacity:.85}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--fill-2);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.gh{display:flex;align-items:center;gap:8px;margin:12px 4px 4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.gh .pd{width:8px;height:8px;border-radius:3px}
.gh .c{margin-left:auto;font-weight:500;color:var(--ink-3)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.strip button{border:0;border-radius:14px;padding:8px 0;background:var(--fill);display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s}
.strip button small{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.strip button b{font-size:16px;font-weight:600}
.strip button .dots{display:flex;gap:3px;height:6px}
.strip button .dots i{width:5px;height:5px;border-radius:50%;background:var(--primary)}
.strip button .dots i.v{background:var(--purple-500)}
.strip button.on{background:var(--ink);color:var(--glass-strong)}
.strip button.on small{color:inherit;opacity:.7}
.next{border-radius:20px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#0C66E4 0%,#0A2A6B 70%,#0B1433 100%);position:relative;overflow:hidden;margin-bottom:12px}
.next::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(133,184,255,.45),transparent 70%)}
.next small{opacity:.75;font-size:12px}
.next b{display:block;font-size:17px;margin:2px 0 8px;letter-spacing:-.01em}
.next .row2{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.next .cd{font:600 13px var(--mono);background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px}
.next .btn{margin-left:auto;background:#fff;color:#0A2A6B;border-color:transparent}
.dayline{position:relative;flex:1;min-height:150px;border-left:2px solid var(--hair-2);margin-left:58px;padding-left:14px;display:flex;flex-direction:column;gap:8px}
.dl-i{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 10px;border-radius:12px;background:var(--fill);font-size:13px;align-items:center}
.dl-i::before{content:attr(data-t);position:absolute;left:-60px;top:9px;width:40px;text-align:right;font:500 11.5px var(--mono);color:var(--ink-3)}
.dl-i::after{content:"";position:absolute;left:-20px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--glass-strong);border:2px solid var(--hair-2)}
.dl-i.m{background:var(--info-bg)}.dl-i.m::after{border-color:var(--primary)}
.dl-i.p{background:var(--violet-bg)}.dl-i.p::after{border-color:var(--purple-500)}
.dl-i.d::after{border-color:var(--amber-500)}
.dl-i.past{opacity:.55}
.dl-i b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-now{position:relative;height:0;border-top:2px dashed var(--red-500);margin:2px 0}
.dl-now::before{content:"Şimdi 11:24";position:absolute;left:-60px;top:-8px;font:600 10.5px var(--mono);color:var(--red-500)}
.tm-row{display:grid;grid-template-columns:30px minmax(110px,1fr) minmax(120px,1.2fr) 150px 52px;gap:14px;align-items:center;padding:10px 4px;border-top:1px solid var(--hair)}
.tm-row:first-of-type{border-top:0}
.tm-row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-row .nm small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
.load{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--fill-2)}
.load i{height:100%}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.heat i{height:22px;border-radius:6px;background:var(--fill-2);position:relative}
.heat i[data-h]:hover::after{content:attr(data-h);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--glass-strong);font:500 11px var(--mono);padding:2px 6px;border-radius:6px;white-space:nowrap}
.tm-head{display:grid;grid-template-columns:30px minmax(110px,1fr) minmax(120px,1.2fr) 150px 52px;gap:14px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 4px 6px}
.orgtop{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center}
.donut{position:relative;width:118px;height:118px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .rv b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.donut .rv span{font-size:11px;color:var(--ink-3)}
.okpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okpis div{padding:10px 12px;border-radius:14px;background:var(--fill)}
.okpis b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.okpis span{font-size:11.5px;color:var(--ink-3)}
.spark{width:100%;height:56px;margin-top:12px}
@media (max-width:1180px){.a-effort,.a-focus,.a-work,.a-cal,.a-team,.a-org{grid-column:span 12}.eff{grid-template-columns:150px minmax(0,1fr)}.eff .estats{grid-column:1/-1;flex-direction:row;justify-content:space-between}}
@media (max-width:760px){.eff{grid-template-columns:1fr}.eff .ring{margin:0 auto}.tm-row,.tm-head{grid-template-columns:30px minmax(0,1fr) 120px}.tm-row .heat,.tm-row .hrs,.tm-head .hh{display:none}}

.hmark::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg, transparent 0 70%, rgba(133,184,255,.35) 80%, transparent 90%);animation:spin 9s linear infinite}
.hmark::after{content:"";position:absolute;inset:2px;border-radius:22px;background:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-bg-2)}
.eyebrow .ws{letter-spacing:.02em;text-transform:none;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--seg-bg)}
.hero h1{font-size:34px;font-weight:600;letter-spacing:-.035em;margin:4px 0 2px;line-height:1.05;color:var(--on-bg)}
.hero .sub{color:var(--on-bg-2)}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){.hmark{width:58px;height:58px;border-radius:18px}.hmark i{width:34px;height:34px}.hero h1{font-size:26px}}

/* ---------- Zaman ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px}
.wd{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:340px;min-width:0}
.wd.today{box-shadow:var(--glass-shadow), 0 0 0 2px var(--primary)}
.wd.wk{opacity:.72}
.wd-h{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px}
.wd-h b{font-size:15px;font-weight:600}
.wd-h span{font:500 12px var(--mono);color:var(--ink-3)}
.wd .meter{margin:0 4px 4px}
.log{border-radius:14px;padding:10px 12px;background:var(--glass-strong);border:1px solid var(--hair);font-size:13px;cursor:grab;transition:transform .2s var(--spring)}
.log:hover{transform:translateY(-2px)}
.log b{display:block;font-weight:600;font-size:13px}
.log small{color:var(--ink-3)}
.log .dur{float:right;font:600 12px var(--mono)}
.plan{border-radius:14px;padding:10px 12px;background:var(--violet-bg);font-size:13px}

/* ---------- Giris ---------- */
.login{min-height:100vh;display:grid;place-items:center;position:relative;z-index:1;padding:40px 0}
.lcard{width:min(420px,100%);border-radius:34px;padding:34px 30px;text-align:center}
.lcard .hmark{margin:0 auto 18px}
.lcard h1{margin:0 0 6px;font-size:26px;letter-spacing:-.03em}
.ms{width:100%;justify-content:center;padding:13px 18px;font-size:15px;margin-top:22px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--hair-2)}

/* ---------- Mobil dock ---------- */
.mdock{display:none}
.note{margin:22px 4px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.note div{border-radius:20px;padding:14px 16px;font-size:13px;color:var(--ink-2);background:var(--glass)}
.note b{display:block;color:var(--ink);margin-bottom:4px}

@media (max-width:1180px){
  .tabs button span{display:none}
  .brand .wm{display:none}
  .c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}
  .work,.two,.hub{grid-template-columns:1fr}
  .side,.snav{position:static;max-height:none}
  .week{grid-template-columns:repeat(4,minmax(150px,1fr))}
  .cal{grid-template-columns:repeat(4,minmax(120px,1fr))}
  .live .l{display:none}
}
@media (max-width:760px){
  body{padding-bottom:120px}
  .tabs,.isep.hide-m,.iconb.hide-m{display:none}
  .brand .wm{display:none}
  .island{width:100%;justify-content:space-between}
  .mdock-d{display:none}
  .mdock{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:55;justify-content:space-around;padding:8px;border-radius:26px;background:var(--island)}
  .mdock button{border:0;background:transparent;color:var(--island-ink-2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;padding:6px 8px;border-radius:14px}
  .mdock button.on{color:var(--island-ink);background:var(--island-2)}
  .mdock svg{width:20px;height:20px}
  .ph h1{font-size:28px}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .effort{flex-direction:column}
  .days{width:100%}
  .kgrid,.health,.frm{grid-template-columns:1fr}
  .mem{grid-template-columns:30px minmax(0,1fr) 60px 70px}
  .mem .mw{display:none}
  .dock{grid-template-columns:repeat(2,1fr)}
  .tg{grid-template-columns:44px repeat(5,minmax(110px,1fr));overflow-x:auto}
  .cal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(3,minmax(240px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  ::view-transition-old(main),::view-transition-new(main){animation:none!important}

AFTER.work = () => bindBoard()
function bindBoard() {
  let dragK = null
  $$('.tc').forEach((c) => {
    c.addEventListener('dragstart', (e) => { dragK = c.dataset.k; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move' })
    c.addEventListener('dragend', () => c.classList.remove('dragging'))
  })
  $$('.col').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over') })
    col.addEventListener('dragleave', () => col.classList.remove('over'))
    col.addEventListener('drop', (e) => {
      e.preventDefault(); col.classList.remove('over')
      const t = TASKS.find((x) => x.k === dragK); if (!t || t.s === col.dataset.col) return
      t.s = col.dataset.col
      const upd = () => { $('#wbody').innerHTML = boardView(); wire($('#wbody')); bindBoard() }
      document.startViewTransition && !reduce ? document.startViewTransition(upd) : upd()
      toast(`${t.k} → ${COLS.find((c) => c[0] === t.s)[1]}`)
    })
  })
}

    <div class="mcols"><div><div class="bk-h" style="margin-top:0">Gündem</div><ol style="margin:0;padding-left:18px;color:var(--ink-2);line-height:1.8"><li>Sprint hedefleri ve kapasite</li><li>Vakko ATM sertifika riski</li><li>Beymen demo hazırlığı</li></ol>
      <div class="bk-h">Efor olarak kaydet</div><div class="field" style="border-radius:14px;justify-content:space-between"><span><b>Duosis · İç</b><span class="muted"> · Toplantı</span></span><span class="dur"><button type="button" data-tg1>30 dk</button><button type="button" class="on" data-tg1>1 sa</button></span></div></div>
      <div><div class="bk-h" style="margin-top:0">Katılımcılar</div>${[['GH', 'Düzenleyen', 'ok', 'Kabul'], ['AL', '', 'ok', 'Kabul'], ['AT', '', 'warn', 'Belki'], ['KJ', '', '', 'Yanıt yok'], ['LT', '', 'ok', 'Kabul']].map(([k, r, c, st]) => `<div class="att">${av(k)}<span>${U[k][0]}${r ? ` <span class="muted" style="font-size:12px">· ${r}</span>` : ''}</span><span class="rs">${tag(c, st)}</span></div>`).join('')}<div class="muted" style="font-size:12.5px;margin-top:6px">+7 kişi</div></div></div>
    <div class="mf"><a class="btn" href="#">${svg('meet')}Teams'te aç</a><button type="button" class="btn pri" data-save="Toplantı eforu kaydedildi · 1 saat">${svg('time')}Efor olarak kaydet</button></div>`,
  saveview: () => `${MH('filter', 'Görünümü kaydet', 'Filtre, yerleşim ve gruplama birlikte saklanır')}<div class="frm" style="grid-template-columns:1fr"><label>Ad<input class="inp" id="sv-n" placeholder="örn. Vakko gecikmişler"></label><label>Görünürlük${seg('vis', [['me', 'Yalnız ben'], ['all', 'İş erişimi olan herkes']], 'me')}</label></div><div class="mf"><button type="button" class="btn ghost" data-close>Vazgeç</button><button type="button" class="btn pri" data-save="Görünüm kaydedildi">Kaydet</button></div>`,
  convert: () => `${MH('ticket', 'Talepten iş kalemi', 'SUP-1042 · Mağaza kasasında fiş basılmıyor', 'linear-gradient(145deg,#F87168,#C9372C)')}<div class="sig">İş sana atanır ve talebe geri bağlanır.</div><div class="frm" style="margin-top:12px"><label>Müşteri<select class="inp"><option>Vakko</option></select></label><label>Proje<select class="inp"><option>Mağaza</option></select></label><label class="full">Başlık<input class="inp" value="Mağaza kasasında fiş basılmıyor"></label><label>Öncelik<span class="dur"><button type="button" data-tg1>Orta</button><button type="button" class="on" data-tg1>Yüksek</button></span></label><label>Termin<input class="inp" value="2 Eki 2026"></label></div><div class="mf"><button type="button" class="btn ghost" data-close>Vazgeç</button><button type="button" class="btn pri" data-save="İş kalemi oluşturuldu · ISSUE-13">Oluştur</button></div>`,
  newticket: () => `${MH('ticket', 'Yeni destek talebi', 'Duosis destek ekibine iletilir', 'linear-gradient(145deg,#F87168,#C9372C)')}<div class="bk-h">Kategori</div><div class="dur">${['Hata', 'Kesinti', 'İyileştirme', 'Soru', 'Veri düzeltme'].map((x, i) => `<button type="button" class="${i ? '' : 'on'}" data-tg1>${x}</button>`).join('')}</div><div class="bk-h" style="margin-top:14px">Etki</div><div class="opt">${[['Tek kullanıcı', 'Yalnız ben etkileniyorum'], ['Birden fazla kullanıcı', 'Ekip etkileniyor'], ['Çalışamıyoruz', 'İş durdu'], ['Güvenlik / veri riski', 'Hemen bakılmalı']].map(([a, b]) => `<button type="button"><b>${a}</b><small>${b}</small></button>`).join('')}</div><div class="frm" style="grid-template-columns:1fr;margin-top:14px"><label>Başlık<input class="inp" maxlength="160"></label><label>Açıklama<textarea class="inp" rows="3"></textarea></label></div><div class="mf"><button type="button" class="btn ghost" data-close>Vazgeç</button><button type="button" class="btn pri" data-save="Talep gönderildi · SUP-1043">Gönder</button></div>`,
  user: () => `${MH('users', 'Kullanıcıyı düzenle', 'Alan Turing · alan@duosis.com')}<div class="frm"><label>E-posta<input class="inp" value="alan@duosis.com"></label><label>Ad soyad<input class="inp" value="Alan Turing"></label><label class="full">Roller<div class="dur"><button type="button" data-tg>Sistem yöneticisi</button><button type="button" class="on" data-tg>Çalışan</button><button type="button" data-tg>Proje lideri</button><button type="button" data-tg>Raporlar</button></div></label><label style="flex-direction:row;align-items:center;gap:10px"><button type="button" class="sw on" data-sw aria-label="Aktif"></button>Aktif</label></div><div class="mf"><button type="button" class="btn ghost" data-close>Vazgeç</button><button type="button" class="btn pri" data-save="Kullanıcı kaydedildi">Kaydet</button></div>`,
  members: () => `${MH('users', 'ATM üyeleri', 'Vakko · lider kendi ekibini yönetir')}${['AL', 'GH', 'AT'].map((k, i) => `<div class="mem" style="grid-template-columns:30px 1fr auto auto">${av(k)}<span>${U[k][0]}</span><span class="seg" style="transform:scale(.9)"><button type="button" class="${i === 0 ? 'on' : ''}">Lider</button><button type="button" class="${i ? 'on' : ''}">Üye</button><button type="button">İzleyici</button></span><button type="button" class="btn sm ghost danger">Çıkar</button></div>`).join('')}<div class="mf"><button type="button" class="btn">${svg('plus')}Üye ekle</button><button type="button" class="btn pri" data-close>Tamam</button></div>`,
  token: () => `${MH('key', 'API token oluşturuldu', 'Reporting Bot · canlı ortam', 'linear-gradient(145deg,#4BCE97,#1F845A)')}<div class="sig warn">Bu token bir daha gösterilmeyecek. Şimdi güvenli bir yere kaydet.</div><div class="code" style="margin-top:12px"><button type="button" class="cp" data-copy>Kopyala</button>hms_live_••••••••••••••••••••3f9a</div><div class="mf"><span class="l"><input type="checkbox" id="tk-ok"><label for="tk-ok">Kopyaladım ve güvenle sakladım</label></span><button type="button" class="btn pri" data-close>Kapat</button></div>`,
  refform: () => `${MH('ref', 'Yeni kayıt', 'Kod addan otomatik üretilir')}<div class="frm"><label>Ad<input class="inp" id="rf-n"></label><label>Kod<input class="inp mono" id="rf-c" placeholder="otomatik"></label><label class="full">Açıklama<textarea class="inp" rows="2"></textarea></label></div><div class="mf"><button type="button" class="btn ghost" data-close>Vazgeç</button><button type="button" class="btn pri" data-save="Kaydedildi">Kaydet</button></div>`,
}
function openModal(kind, origin) {
  if (kind === 'dock') { openDrop('cmd'); return }
  if (kind === 'log') { logStep = 0; logSel = {} }
  modal.innerHTML = MODALS[kind]()
  if (origin && !reduce) {
    const r = origin.getBoundingClientRect()
    modal.style.transformOrigin = `${r.left + r.width / 2 - (innerWidth - Math.min(720, innerWidth - 32)) / 2}px ${r.top - 40}px`
  }
  scrim.classList.add('open'); wire(modal)
  setTimeout(() => modal.querySelector('input,button:not([data-close])')?.focus(), 80)
}
function closeModal() { scrim.classList.remove('open') }
scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal() })

// ================================================================ DETAY PANELI
const panel = $('#panel')
let pTab = 'd'
function openPanel(k) {
  const x = TASKS.find((t) => t.k === k) || TASKS[2]
  panel.innerHTML = `<button type="button" class="btn sm ghost x" data-close-panel aria-label="Kapat">${svg('x')}</button>
  <div class="lk">${x.k} · ${x.ty}</div><h2 style="margin:6px 0 10px;font-size:22px;letter-spacing:-.02em;padding-right:40px">${esc(x.t)}</h2>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${stTag[x.s]}<span class="due ${x.tone}">Termin: ${x.due}</span>${tag('', prLabel[x.pr])}</div>
  <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap"><button type="button" class="btn sm pri" data-open="log">${svg('time')}Efor gir</button><button type="button" class="btn sm" data-toast="${x.k} takip ediliyor">Takip et</button><button type="button" class="btn sm">Tamamla</button><button type="button" class="btn sm ghost">Düzenle</button></div>
  <div class="utabs">${[['d', 'Ayrıntılar'], ['a', 'Aktivite'], ['c', 'Yorumlar 2'], ['f', 'Ekler 1']].map(([id, l]) => `<button type="button" data-ptab="${id}" class="${pTab === id ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div id="pbody">${pBody(x)}</div>`
  panel.classList.add('open'); wire(panel)
}
function pBody(x) {
  if (pTab === 'a') return `<div class="tl"><div><b>Ada</b> durumu <b>Devam ediyor</b> yaptı<br><small class="muted">3 sa önce</small></div><div><b>Grace</b> işi oluşturdu ve Ada ile Katherine'e atadı<br><small class="muted">Dün 16:20</small></div><div><b>Ada</b> 1,75 saat efor girdi<br><small class="muted">Bugün 11:02</small></div></div>`
  if (pTab === 'c') return `<div class="conv" style="margin-top:0"><div class="msg cust"><small>Grace · Dün</small>Sertifika süresi 12 Ekim'de doluyor, öncesinde bitmeli.</div><div class="msg agent"><small>Siz · Bugün</small>Otomasyon hazır, yarın staging'de test ediyorum.</div></div><div class="composer"><textarea aria-label="Yorum" placeholder="Yorum yaz…"></textarea><div style="display:flex;justify-content:flex-end"><button type="button" class="btn pri sm" data-toast="Yorum gönderildi">Gönder</button></div></div>`
  if (pTab === 'f') return `<div class="drz">Dosya sürükle ya da seç · dosyalar eklenmeden önce taranır</div><div class="mem" style="grid-template-columns:1fr auto auto"><span>sertifika-plan.pdf <small class="muted">· 240 KB</small></span><button type="button" class="btn sm">İndir</button><button type="button" class="btn sm ghost danger">Kaldır</button></div>`
  return `<dl class="dl"><dt>Müşteri · Proje</dt><dd>${x.c} · ${x.p}</dd><dt>Alt proje</dt><dd>Faz 1</dd><dt>Atayan</dt><dd>Grace Hopper</dd><dt>Atananlar</dt><dd><span class="avs">${x.who.map(av).join('')}</span></dd><dt>Takipçiler</dt><dd>2 kişi</dd><dt>Planlanan</dt><dd>24 Eyl 2026</dd><dt>Faturalanabilir</dt><dd>Evet (projeden)</dd><dt>Üst iş</dt><dd><a href="#">TASK-40 · Altyapı yenileme</a></dd><dt>Kaynak</dt><dd><a href="#" data-go="tickets">SUP-1042</a></dd><dt>Alt işler</dt><dd><div class="meter" style="width:140px;display:inline-block;vertical-align:middle"><i style="width:66%;background:var(--grad)"></i></div> 2 / 3</dd></dl><p style="margin-top:16px;color:var(--ink-2)">Let's Encrypt sertifikalarının yenilenmesini cron yerine ingress seviyesinde otomatikleştir; mağaza cihazlarına dağıtımı doğrula.</p>`
}
function closePanel() { panel.classList.remove('open') }

// ================================================================ BAGLAMA
function segInd(s) { const on = s.querySelector('button.on'); const ind = s.querySelector('.ind'); if (on && ind) { ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px' } }
function wire(root) {
  $$('.seg', root).forEach((s) => { requestAnimationFrame(() => segInd(s)) })
  $$('.card', root).forEach((c) => c.addEventListener('pointermove', (e) => { const r = c.getBoundingClientRect(); c.style.setProperty('--gx', e.clientX - r.left + 'px'); c.style.setProperty('--gy', e.clientY - r.top + 'px') }))
  if ($('#cmdIn', root)) $('#cmdIn', root).addEventListener('input', (e) => renderCmd(e.target.value))
  const ts = $('#themeSeg', root); if (ts) { const cur = document.documentElement.getAttribute('data-theme') || 'light'; $$('[data-theme-set]', ts).forEach((b) => b.classList.toggle('on', b.dataset.themeSet === cur)) }
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a, [data-task], [data-open], [role="button"]')
  if (!e.target.closest('.msel')) $$('.msel.open').forEach((x) => x.classList.remove('open'))
  if (!t) { if (!e.target.closest('.drop') && !e.target.closest('.island')) closeDrop(); return }
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault()
  const d = t.dataset
  if (d.unsel) { e.stopPropagation(); const [k, v] = d.unsel.split('|'); FSEL[k] = FSEL[k].filter((x) => x !== v); refreshFilters(); return }
  if (d.mopt) { const [k, v] = d.mopt.split('|'); FSEL[k] = FSEL[k].includes(v) ? FSEL[k].filter((x) => x !== v) : [...FSEL[k], v]; refreshFilters(); return }
  if (d.mall) { FSEL[d.mall] = FOPTS[d.mall].items.map((x) => x.v); refreshFilters(); return }
  if (d.mclear) { (d.mclear === '*' ? Object.keys(FSEL) : [d.mclear]).forEach((k) => { FSEL[k] = [] }); refreshFilters(); return }
  if (d.preset) { rPreset = d.preset; $$('[data-preset]').forEach((b) => b.classList.toggle('on', b === t)); refreshFilters(); return }
  if (t.classList.contains('msel-f')) { const m = t.closest('.msel'); const open = !m.classList.contains('open'); $$('.msel.open').forEach((x) => x.classList.remove('open')); if (open) { m.classList.add('open'); setTimeout(() => $('[data-msearch]', m).focus(), 60) } return }
  if (d.go) { go(d.go); return }
  if (d.open) { openModal(d.open, t); return }
  if (d.task && !t.closest('.drop')) { openPanel(d.task); return }
  if (d.task) { closeDrop(); if (page !== 'work') go('work'); setTimeout(() => openPanel(d.task), 350); return }
  if (d.closePanel !== undefined) { closePanel(); return }
  if (d.close !== undefined) { closeModal(); return }
  if (d.save) { closeModal(); setTimeout(() => toast(d.save), 180); return }
  if (d.toast) { toast(d.toast); return }
  if (d.copy !== undefined) { navigator.clipboard?.writeText(t.parentElement.textContent.replace('Kopyala', '').trim()).catch(() => {}); t.textContent = 'Kopyalandı'; return }
  if (d.pick) { logSel[d.pick] = d.v; logStep++; modal.innerHTML = MODALS.log(); wire(modal); return }
  if (d.back !== undefined) { logStep--; modal.innerHTML = MODALS.log(); wire(modal); return }
  if (d.sw !== undefined) { t.classList.toggle('on'); return }
  if (d.tg !== undefined) { t.classList.toggle('on'); return }
  if (d.tg1 !== undefined) { $$('button', t.parentElement).forEach((b) => b.classList.remove('on')); t.classList.add('on'); return }
  if (d.themeSet) { document.documentElement.setAttribute('data-theme', d.themeSet); wire(drop); try { localStorage.setItem('hermes-liquid-theme', d.themeSet) } catch {} return }
  if (d.act === 'pause') { paused = !paused; drop.innerHTML = DROPS.live(); wire(drop); return }
  if (d.act === 'stoplog') { closeDrop(); openModal('log', t); return }
  if (d.act === 'readall') { $$('.notif', drop).forEach((n) => n.classList.add('read')); $('#bellCnt').hidden = true; return }
  if (d.view) { view = d.view; $$('.side button[data-view]').forEach((b) => b.classList.toggle('on', b === t)); return }
  if (d.set) { setPage = d.set; if (page !== 'settings') { go('settings'); return } $('#sbody').innerHTML = SET[setPage](); wire($('#sbody')); $$('.snav button[data-set]').forEach((b) => b.classList.toggle('on', b.dataset.set === setPage)); return }
  if (d.dev) { devSec = d.dev; $('#devbody').innerHTML = devBody(); wire($('#devbody')); $$('.snav button[data-dev]').forEach((b) => b.classList.toggle('on', b.dataset.dev === devSec)); return }
  if (d.tk) { tkSel = d.tk; $$('.tk').forEach((b) => b.classList.toggle('on', b === t)); $('#wb').innerHTML = workbench(); wire($('#wb')); return }
  if (d.ptab) { pTab = d.ptab; const x = TASKS.find((q) => panel.textContent.includes(q.k)) || TASKS[2]; $$('.utabs button', panel).forEach((b) => b.classList.toggle('on', b === t)); $('#pbody').innerHTML = pBody(x); wire($('#pbody')); return }
  const s = t.closest('.seg')
  if (s && d.v) {
    $$('button', s).forEach((b) => b.classList.toggle('on', b === t)); segInd(s)
    const id = s.dataset.seg
    if (id === 'layout') { layout = d.v; groupBy = layout === 'board' ? 'status' : 'project'; go('work') }
    if (id === 'group') { groupBy = d.v; const up = () => { $('#wbody').innerHTML = layout === 'board' ? boardView() : listView(); wire($('#wbody')); bindBoard() }; document.startViewTransition && !reduce ? document.startViewTransition(up) : up() }
    if (id === 'tview') { timeView = d.v; $('#tbody').innerHTML = timeView === 'week' ? weekView() : sheetView(); wire($('#tbody')) }
    if (id === 'utab') { userTab = d.v; $('#sbody').innerHTML = SET.users(); wire($('#sbody')) }
    if (id === 'arch') { archive = d.v; toast(archive === 'archive' ? 'Arşiv havuzu · salt okunur' : 'Aktif işler') }
    return
  }
  if (t.id === 'searchBtn') { openDrop('cmd'); return }
  if (t.id === 'liveBtn') { openDrop('live'); return }
  if (t.id === 'bellBtn') { openDrop('bell'); return }
  if (t.id === 'meBtn') { openDrop('me'); return }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrop(); closeModal(); closePanel(); $$('.msel.open').forEach((x) => x.classList.remove('open')) }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openDrop('cmd') }
  if (e.target.id === 'cmdIn' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const bs = $$('#cmdRes button'); const i = bs.findIndex((b) => b.classList.contains('sel')); const n = (i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, j) => b.classList.toggle('sel', j === n)); bs[n]?.scrollIntoView({ block: 'nearest' }) }
  if (e.key === 'Enter' && e.target.id === 'cmdIn') { $('#cmdRes button.sel')?.click() }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-task], .tc[data-task], .mt[data-open]')) { e.preventDefault(); e.target.click() }
})
addEventListener('pointermove', (e) => { const bm = $('#bm'); bm.style.setProperty('--mx', e.clientX - innerWidth * .13 + 'px'); bm.style.setProperty('--my', e.clientY - innerWidth * .13 + 'px') }, { passive: true })
const dockD = $('#dockD')
dockD.addEventListener('pointermove', (e) => { if (reduce) return; $$('.di', dockD).forEach((b) => { const r = b.getBoundingClientRect(); const d = Math.abs(e.clientX - (r.left + r.width / 2)); const k = Math.max(0, 1 - d / 150); const sz = 44 + 22 * k * k; b.style.width = sz + 'px'; b.style.height = sz + 'px' }) })
dockD.addEventListener('pointerleave', () => $$('.di', dockD).forEach((b) => { b.style.width = ''; b.style.height = '' }))
addEventListener('resize', () => { moveInd(); $$('.seg').forEach(segInd) })

try { const th = localStorage.getItem('hermes-liquid-theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th) } catch {}
let start = 'home'; try { start = localStorage.getItem('hermes-liquid-page') || 'home' } catch {}
if (location.hash && PAGES[location.hash.slice(1)]) start = location.hash.slice(1)
go(PAGES[start] ? start : 'home')
document.fonts?.ready.then(() => { moveInd(); $$('.seg').forEach(segInd) })
})()
</script>
