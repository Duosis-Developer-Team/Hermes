# =============================================================================
# HERMES Frontend - Nginx Config (Production Image)
# =============================================================================
# Single-page app served from the Vite build output. The key invariant:
# every path that is NOT an existing file under the document root falls
# back to /index.html so React Router can render the route. This is what
# lets /tasks, /time-entry, /task-management, /customers, etc. survive a
# direct navigation or a hard refresh (Cmd+Shift+R) — without the
# fallback, nginx returns 404 and the browser shows a blank page.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers — TEK KAYNAK (bkz. nginx-security-headers.inc).
    # DIKKAT: nginx add_header'i alt seviyeye yalnizca o seviyede HIC
    # add_header yoksa devralir. Cache-Control tanimlayan her location
    # bu yuzden ayni parcayi TEKRAR include ETMEK ZORUNDADIR; aksi halde
    # guvenlik header'lari sessizce duser (Sprint 5.1 bulgusu).
    include /etc/nginx/conf.d/security-headers.inc;

    # 1) Hashed asset bundles emitted by Vite. Content-addressable, safe to
    #    cache forever. Never fall back to /index.html here — a missing
    #    bundle should surface as 404 instead of being masked as a 200
    #    HTML response that breaks at parse time.
    location ^~ /assets/ {
        try_files $uri =404;
        # `expires 1y` KENDI Cache-Control'unu (max-age) yazar; yanina bir
        # de add_header konulunca cevap IKI Cache-Control satiri
        # tasiyordu. Tek satirda birlestirildi — sozlesme ayni (uzun
        # cache + immutable), tekrar yok.
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # 2) Runtime config injected at deploy time. Must always reflect the
    #    current pod, never cache.
    location = /env-config.js {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # 3) The HTML shell must not be cached or a stale shell will keep
    #    pointing at deleted /assets/<hash> bundles after a deploy.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # 4) SPA fallback. Any other path that isn't a real file under the
    #    document root returns the React shell. React Router then renders
    #    /tasks, /time-entry, /task-management, /users, etc. on direct
    #    navigation or hard refresh. API requests (/api/v1/...) never
    #    reach this nginx — the cluster ingress routes them to the
    #    backend services before they get here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
